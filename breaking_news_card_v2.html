<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ki-news Karte v2 (Prototyp)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:420px;height:660px;overflow:hidden}
body{position:relative;font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg)}
#szene{position:absolute;inset:0;width:420px;height:660px}
.kopf{position:absolute;top:16px;left:20px;right:20px;display:flex;align-items:center;gap:9px;z-index:3}
.badge{font:700 10px/1 'JetBrains Mono',monospace;letter-spacing:.14em;padding:5px 8px;background:var(--accent);color:var(--badgeText)}
.marke{font:700 10px/1 'JetBrains Mono',monospace;letter-spacing:.18em;color:var(--sub)}
.datum{margin-left:auto;font:500 10px/1 'JetBrains Mono',monospace;color:var(--sub)}
.text{position:absolute;left:22px;right:22px;top:318px;bottom:40px;display:flex;flex-direction:column;z-index:3}
.titel{font:800 20px/1.28 'Inter',sans-serif;color:var(--main);letter-spacing:-.005em}
.quelle{margin-top:8px;font:600 9px/1 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--sub)}
.quelle b{color:var(--accent);font-weight:700}
.einordnung{margin-top:auto;border-left:3px solid var(--accent);background:var(--boxBg);padding:11px 13px 12px}
.einordnung .lab{font:700 8.5px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--accent);margin-bottom:7px}
.einordnung p{font:500 12.5px/1.55 'Inter',sans-serif;color:var(--main)}
.einordnung p span{transition:none}
.fuss{position:absolute;left:22px;right:22px;bottom:14px;display:flex;justify-content:space-between;font:700 9.5px/1 'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--sub);z-index:3}
.fort{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);z-index:4;width:0}
/* Zeitung (26.09.26): Zeitungsdruck-Look fuer Kopf/Box, nur in diesem Stil aktiv */
body[data-stil="zeitung"] .kopf{padding-bottom:8px;border-bottom:3px double var(--ink)}
body[data-stil="zeitung"] .badge{border-radius:0}
body[data-stil="zeitung"] .marke{letter-spacing:.24em}
body[data-stil="zeitung"] .einordnung{border-left:none;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding-top:10px}
/* Auftrag 6 (28.09.26): neue Stile neon/typo/riso, nur aktiv ueber KARTEN_NEUE_STILE (karten_v2.py) */
body[data-stil="neon"] .titel{text-shadow:0 0 18px var(--glow2)}
body[data-stil="neon"] .einordnung{box-shadow:inset 3px 0 0 var(--accent),0 0 24px -8px var(--glow2);border-left-color:transparent}
body[data-stil="typo"] .titel{font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;letter-spacing:-.01em}
body[data-stil="typo"] .einordnung{border-left-width:6px}
body[data-stil="riso"] .titel{text-shadow:1.4px 1px 0 var(--glow2)}
body[data-stil="riso"] .badge{mix-blend-mode:multiply}
body[data-stil="riso"] .einordnung{border-left-color:var(--accent);box-shadow:-2px 1px 0 -1px var(--ink)}
</style>
</head>
<body>
<canvas id="szene" width="420" height="660"></canvas>
<div class="kopf"><div class="badge" id="badge"></div><div class="marke">KI-NEWS.LIVE</div><div class="datum" id="datum"></div></div>
<div class="text" id="text">
  <div class="titel" id="titel"></div>
  <div class="quelle" id="quelle"></div>
  <div class="einordnung" id="einord"><div class="lab">⚡ SCAMPY ORDNET EIN</div><p id="einordText"></p></div>
</div>
<div class="fuss" id="fuss"><span></span><span id="motivLabel"></span></div>
<div class="fort" id="fort"></div>
<script>window.KARTE = {{KARTE_JSON}};</script>
<script>
(function () {
'use strict';
const K = window.KARTE, W = 420, H = 660, SH = 300;
const DPR = window.devicePixelRatio || 1;
const cv = document.getElementById('szene'), ctx = cv.getContext('2d');
cv.width = W * DPR; cv.height = H * DPR; ctx.scale(DPR, DPR);

// ── Paletten (eine je Stil) ────────────────────────────────────────────────
const PAL = {
  blaupause: {bg:'#0b1d38', grid:'rgba(150,200,255,.09)', grid2:'rgba(150,200,255,.18)', ink:'#d8ecff', dim:'rgba(216,236,255,.55)',
              accent:'#ff8a3d', main:'#eef5ff', sub:'rgba(216,236,255,.62)', boxBg:'rgba(255,138,61,.09)', badgeText:'#0b1d38', glow:'rgba(160,210,255,.55)'},
  tusche:    {bg:'#f1e9d6', grid:null, ink:'#1c1916', dim:'rgba(28,25,22,.45)', accent:'#c0391f', main:'#1c1916',
              sub:'rgba(28,25,22,.6)', boxBg:'rgba(192,57,31,.07)', badgeText:'#f1e9d6', glow:null},
  daten:     {bg:'#04070f', grid:'rgba(0,229,255,.05)', grid2:'rgba(0,229,255,.12)', ink:'#e8edf8', dim:'rgba(232,237,248,.45)',
              accent:'#00e5ff', accent2:'#ff6b00', main:'#e8edf8', sub:'rgba(232,237,248,.55)', boxBg:'rgba(0,229,255,.06)', badgeText:'#04070f', glow:'rgba(0,229,255,.6)'},
  // Kreide (26.09.26): Schultafel — dunkles Tafelgruen, Kreidestaub-Textur, koernige/unterbrochene Striche
  kreide:    {bg:'#1f2b26', grid:null, ink:'#eef0ea', dim:'rgba(238,240,234,.42)', accent:'#f2cf4b', accent2:'#e2574c',
              main:'#f5f3ea', sub:'rgba(245,243,234,.62)', boxBg:'rgba(242,207,75,.10)', badgeText:'#1f2b26', glow:null},
  // Zeitung (26.09.26): Zeitungsdruck — Off-White-Papier, harte schwarze Striche, Signalrot als Akzent
  zeitung:   {bg:'#eeece2', grid:null, ink:'#161513', dim:'rgba(22,21,19,.45)', accent:'#d81f1f', accent2:'#161513',
              main:'#141311', sub:'rgba(20,19,17,.6)', boxBg:'rgba(216,31,31,.055)', badgeText:'#f5f0e6', glow:null},
  // Auftrag 6 (28.09.26), standardmaessig aus (Schalter KARTEN_NEUE_STILE in karten_v2.py):
  // Neon: Nachtschwarz, Hersteller-Farbwelt, Partikelstrom, Leuchtstriche mit Bloom
  neon:      {bg:'#07060d', grid:null, ink:'#f4f1ff', dim:'rgba(244,241,255,.40)', accent:'#b46bff', accent2:'#29e3ff',
              main:'#f7f5ff', sub:'rgba(247,245,255,.62)', boxBg:'rgba(180,107,255,.10)', badgeText:'#07060d', glow:'rgba(180,107,255,.9)', glow2:'rgba(180,107,255,.35)'},
  // Typo: kinetische Typografie aus Stichworten der Meldung statt Bildmotiv
  typo:      {bg:'#101012', grid:null, ink:'#f3f1ea', dim:'rgba(243,241,234,.38)', accent:'#e8ff3a', accent2:'#ff5a36',
              main:'#f3f1ea', sub:'rgba(243,241,234,.62)', boxBg:'rgba(232,255,58,.07)', badgeText:'#101012', glow:null},
  // Riso: Zweifarbdruck (Fluo-Pink + Blau) mit Passer-Versatz, Raster und Papierkorn
  riso:      {bg:'#f3eee2', grid:null, ink:'#1d5fb8', dim:'rgba(29,95,184,.5)', accent:'#ff3d8b', accent2:'#1d5fb8',
              main:'#1b2433', sub:'rgba(27,36,51,.64)', boxBg:'rgba(255,61,139,.08)', badgeText:'#fff7f0', glow:null, glow2:'rgba(255,61,139,.32)'}
};
const P = PAL[K.stil] || PAL.daten;
// Hersteller-Farbwelt (Auftrag 6): Neon und Typo faerben sich nach dem erkannten Anbieter
const FARBWELT = {anthropic:['#ff8a5c','#ffd3b0'], openai:['#19c37d','#9af5cf'], google:['#4c8dff','#34d27a'], meta:['#2f86ff','#a66bff'],
  microsoft:['#1fb0ff','#8fd400'], nvidia:['#8ad100','#e2ff6a'], xai:['#e9e9ef','#8f8fff'], deepseek:['#5a78ff','#9fb6ff'],
  mistral:['#ff8a0a','#ffd84a'], amazon:['#ff9f1a','#ffd28a']};
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'}
if(K.stil==='neon'||K.stil==='typo'){const fw=FARBWELT[((K.anbieter||[])[0]||'').toLowerCase()];
  if(fw){P.accent=fw[0];P.accent2=fw[1];P.boxBg=rgba(fw[0],K.stil==='neon'?.10:.07);if(K.stil==='neon'){P.glow=rgba(fw[0],.9);P.glow2=rgba(fw[0],.35)}}}
for (const k in P) if (P[k]) document.documentElement.style.setProperty('--' + k, P[k]);
if (!document.body.dataset.stil) document.body.dataset.stil = K.stil;

// ── Hilfen: Zufall mit festem Samen, Easing ───────────────────────────────
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const prog=(t,t0,d)=>ease((t-t0)/d);
const lerp=(a,b,x)=>a+(b-a)*x;

// ── Formen als Punktlisten, mit fester Handzitter-Abweichung ──────────────
function seg(a,b,n=14){const p=[];for(let i=0;i<=n;i++)p.push([lerp(a[0],b[0],i/n),lerp(a[1],b[1],i/n)]);return p}
function arc(cx,cy,r,a0,a1,n=40){const p=[];for(let i=0;i<=n;i++){const a=lerp(a0,a1,i/n);p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return p}
function poly(pts,closed){let o=[];for(let i=0;i<pts.length-(closed?0:1);i++){const s=seg(pts[i],pts[(i+1)%pts.length]);o=o.concat(i?s.slice(1):s)}return o}
function wobble(pts,amp,seed){const r=rng(seed);let dx=0,dy=0;return pts.map(p=>{dx=dx*.7+(r()-.5)*amp;dy=dy*.7+(r()-.5)*amp;return[p[0]+dx,p[1]+dy]})}
function rot(pts,cx,cy,a){const c=Math.cos(a),s=Math.sin(a);return pts.map(([x,y])=>[cx+(x-cx)*c-(y-cy)*s,cy+(x-cx)*s+(y-cy)*c])}

// Strich bis Fortschritt p (0..1) zeichnen. Stil entscheidet ueber Glanz/Doppelstrich.
function strich(pts,p,w,farbe,seed){
  if(p<=0||pts.length<2)return;
  const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const ziel=L[L.length-1]*clamp(p);
  const pfad=(dx,dy)=>{ctx.beginPath();ctx.moveTo(pts[0][0]+dx,pts[0][1]+dy);
    for(let i=1;i<pts.length;i++){if(L[i]<=ziel){ctx.lineTo(pts[i][0]+dx,pts[i][1]+dy)}else{const f=(ziel-L[i-1])/(L[i]-L[i-1]||1);
      ctx.lineTo(lerp(pts[i-1][0],pts[i][0],f)+dx,lerp(pts[i-1][1],pts[i][1],f)+dy);break}}};
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=farbe||P.ink;
  if(K.stil==='tusche'){const r=rng(seed||7);ctx.globalAlpha=.9;ctx.lineWidth=w;pfad(0,0);ctx.stroke();
    ctx.globalAlpha=.35;ctx.lineWidth=w*.55;pfad((r()-.5)*1.6,(r()-.5)*1.6);ctx.stroke();ctx.globalAlpha=1}
  else if(K.stil==='kreide'){const r=rng(seed||42);ctx.save();
    ctx.lineWidth=w;ctx.globalAlpha=.82;ctx.setLineDash([r()*4+2,r()*3+1]);pfad((r()-.5)*.8,(r()-.5)*.8);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=.3;ctx.lineWidth=w*.6;pfad((r()-.5)*1.4,(r()-.5)*1.4);ctx.stroke();
    ctx.globalAlpha=1;ctx.restore()}
  else if(K.stil==='riso'){ctx.save();ctx.globalCompositeOperation='multiply';
    // Passer-Versatz: jede Linie zusaetzlich blass in der zweiten Druckfarbe, fest je Karte verschoben
    ctx.strokeStyle=(farbe===P.accent)?P.ink:P.accent;ctx.globalAlpha=.42;ctx.lineWidth=w*.9;pfad(RISO_DX,RISO_DY);ctx.stroke();
    ctx.strokeStyle=farbe||P.ink;ctx.globalAlpha=.9;ctx.lineWidth=w;pfad(0,0);ctx.stroke();ctx.restore()}
  else if(K.stil==='neon'){ctx.save();const f=farbe||P.ink;
    ctx.shadowColor=(f===P.dim)?P.glow2:(f===P.ink?P.glow:f);ctx.shadowBlur=14;ctx.globalAlpha=.8;ctx.lineWidth=w*1.5;
    ctx.strokeStyle=(f===P.ink)?P.accent:f;pfad(0,0);ctx.stroke();
    if(f!==P.dim){ctx.shadowBlur=3;ctx.globalAlpha=.9;ctx.lineWidth=Math.max(.8,w*.5);ctx.strokeStyle='#ffffff';pfad(0,0);ctx.stroke()}
    ctx.restore()}
  else{ctx.save();if(P.glow){ctx.shadowColor=P.glow;ctx.shadowBlur=6}ctx.lineWidth=w;pfad(0,0);ctx.stroke();ctx.restore()}
}
const RISO_DX=1.4+(hash(K.titel||'')%5)*.35, RISO_DY=-1.1+(hash((K.titel||'')+'y')%5)*.3;
function schrift(txt,x,y,opt){ctx.save();ctx.globalAlpha=opt.a==null?1:opt.a;ctx.fillStyle=opt.farbe||P.ink;ctx.font=opt.font;ctx.textAlign=opt.align||'left';
  if(opt.rot){ctx.translate(x,y);ctx.rotate(opt.rot);ctx.fillText(txt,0,0)}else ctx.fillText(txt,x,y);ctx.restore()}
// Bemassungslinie (Blaupause): Linie mit Endstrichen + Beschriftung
function mass(a,b,p,label,t){strich(seg(a,b),p,1,P.dim);const n=[-(b[1]-a[1]),b[0]-a[0]],l=Math.hypot(n[0],n[1])||1;
  [a,b].forEach(q=>strich(seg([q[0]-n[0]/l*5,q[1]-n[1]/l*5],[q[0]+n[0]/l*5,q[1]+n[1]/l*5],2),p,1,P.dim));
  if(label)schrift(label,(a[0]+b[0])/2,(a[1]+b[1])/2-6,{font:"500 8.5px 'JetBrains Mono'",farbe:P.dim,align:'center',a:clamp((p-.6)/.4)})}

// ── Hintergrund je Stil ──────────────────────────────────────────────────
let papier=null, kreideTex=null, zeitungTex=null;
function grund(t){
  ctx.fillStyle=P.bg;ctx.fillRect(0,0,W,H);
  if(K.stil==='tusche'){
    if(!papier){papier=document.createElement('canvas');papier.width=W*DPR;papier.height=H*DPR;const c=papier.getContext('2d');c.scale(DPR,DPR);
      const r=rng(99);for(let i=0;i<2600;i++){c.fillStyle='rgba(60,45,25,'+(r()*.06)+')';c.fillRect(r()*W,r()*H,r()*1.6+.3,r()*1.6+.3)}
      const g=c.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,H*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(90,60,20,.13)');c.fillStyle=g;c.fillRect(0,0,W,H)}
    ctx.drawImage(papier,0,0,W,H);
    ctx.strokeStyle='rgba(28,25,22,.18)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(20,SH+6);ctx.lineTo(W-20,SH+6);ctx.stroke();
  } else if(K.stil==='kreide'){
    if(!kreideTex){kreideTex=document.createElement('canvas');kreideTex.width=W*DPR;kreideTex.height=H*DPR;const c=kreideTex.getContext('2d');c.scale(DPR,DPR);
      const r=rng(77);
      for(let i=0;i<2200;i++){c.fillStyle='rgba(230,230,220,'+(r()*.05)+')';c.fillRect(r()*W,r()*H,r()*1.4+.3,r()*1.4+.3)}
      for(let i=0;i<9;i++){const y=40+r()*(SH-20),len=60+r()*160,x0=r()*W;
        c.strokeStyle='rgba(255,255,255,'+(.02+r()*.03)+')';c.lineWidth=8+r()*14;c.lineCap='round';
        c.beginPath();c.moveTo(x0,y);c.quadraticCurveTo(x0+len*.5,y+(r()-.5)*24,x0+len,y+(r()-.5)*10);c.stroke()}}
    ctx.drawImage(kreideTex,0,0,W,H);
  } else if(K.stil==='neon'){
    neonGrund(t);
  } else if(K.stil==='typo'){
    typoGrund(t);
  } else if(K.stil==='riso'){
    risoGrund(t);
  } else if(K.stil==='zeitung'){
    if(!zeitungTex){zeitungTex=document.createElement('canvas');zeitungTex.width=W*DPR;zeitungTex.height=H*DPR;const c=zeitungTex.getContext('2d');c.scale(DPR,DPR);
      const g=6;for(let y=0;y<=SH+20;y+=g){for(let x=0;x<=W;x+=g){const off=((Math.round(x/g)+Math.round(y/g))%2)*g/2;
        c.fillStyle='rgba(20,18,15,.05)';c.beginPath();c.arc(x+off,y,1,0,Math.PI*2);c.fill()}}}
    ctx.drawImage(zeitungTex,0,0,W,H);
    ctx.strokeStyle='rgba(20,18,15,.22)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(20,SH+6);ctx.lineTo(W-20,SH+6);ctx.stroke();
  } else {
    const g=K.stil==='blaupause'?20:30;ctx.lineWidth=1;
    for(let x=0;x<=W;x+=g){ctx.strokeStyle=(x/g)%5===0&&P.grid2?P.grid2:P.grid;ctx.beginPath();ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,SH);ctx.stroke()}
    for(let y=0;y<=SH;y+=g){ctx.strokeStyle=(y/g)%5===0&&P.grid2?P.grid2:P.grid;ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);ctx.stroke()}
    const v=ctx.createLinearGradient(0,SH-60,0,SH+10);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,P.bg);ctx.fillStyle=v;ctx.fillRect(0,SH-60,W,70);
    if(K.stil==='daten'){const y=(t*70)%(SH+40)-20;const s=ctx.createLinearGradient(0,y-12,0,y);s.addColorStop(0,'rgba(0,229,255,0)');s.addColorStop(1,'rgba(0,229,255,.10)');ctx.fillStyle=s;ctx.fillRect(0,y-12,W,12)}
  }
}

// ── Auftrag 6 (28.09.26): Hintergruende und Szenen der neuen Stile ─────────
// Alles ist eine reine Funktion von t und festen Samen aus dem Titel: gleiches t = gleiches Bild.
const SEED=hash(K.titel||'');
function neonGrund(t){
  // zwei langsam wandernde Lichtwolken in den Farben des Anbieters
  [[P.accent,.30,.34,150,0],[P.accent2,.72,.62,130,1.7]].forEach(([c,fx,fy,r,ph])=>{
    const x=W*fx+Math.sin(t*.35+ph+SEED%7)*40,y=SH*fy+Math.cos(t*.28+ph)*22;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(c.charAt(0)==='#'?c:'#b46bff',.28));g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,SH+20)});
  // Perspektiv-Boden (Horizont bei 72 %), Querlinien laufen auf die Kamera zu
  const hy=SH*.72;ctx.save();ctx.beginPath();ctx.rect(0,hy,W,SH-hy);ctx.clip();ctx.lineWidth=1;
  for(let i=-8;i<=8;i++){ctx.strokeStyle=rgba('#ffffff',.05);ctx.beginPath();ctx.moveTo(W/2+i*6,hy);ctx.lineTo(W/2+i*70,SH);ctx.stroke()}
  for(let k=0;k<8;k++){const f=((k+t*.6)%8)/8,y=hy+(SH-hy)*f*f;ctx.strokeStyle=rgba(P.accent.charAt(0)==='#'?P.accent:'#b46bff',.05+.2*f);
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  ctx.restore();
  // Partikelstrom: jede Bahn ist geschlossen in t (Kurve + Drift), Spur = die letzten Positionen
  const r=rng(SEED^0x9e37),n=110;ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  for(let i=0;i<n;i++){const x0=r()*W,y0=r()*SH*.9,v=12+r()*26,a=-.35+r()*.7,amp=6+r()*18,fr=.6+r()*1.4,ph=r()*6.28,sz=.6+r()*1.5,
      c=r()<.7?P.accent:P.accent2,aufl=clamp((t-r()*1.2)/.8);
    if(aufl<=0)continue;
    const pos=tt=>{let x=x0+Math.cos(a)*v*tt,y=y0+Math.sin(a)*v*tt+Math.sin(tt*fr+ph)*amp;x=((x%(W+40))+(W+40))%(W+40)-20;y=((y%SH)+SH)%SH;return[x,y]};
    ctx.strokeStyle=rgba(c.charAt(0)==='#'?c:'#b46bff',.55*aufl);ctx.lineWidth=sz;ctx.beginPath();let q=pos(t),alt=q;ctx.moveTo(q[0],q[1]);
    for(let k=1;k<=5;k++){const z=pos(t-k*.07);if(Math.abs(z[0]-alt[0])>30||Math.abs(z[1]-alt[1])>30)break;ctx.lineTo(z[0],z[1]);alt=z}
    ctx.stroke()}
  ctx.restore();

    schrift('E = mc²',bx+16,by+92,{font:"700 26px 'Caveat'",farbe:P.accent,align:'left',a:prog(t,1.9,.5)});
    schrift('KI + ? =',bx+16,by+114,{font:"600 19px 'Caveat'",farbe:P.dim,align:'left',a:prog(t,2.2,.5)});
    const hx=300,hy=150;
    strich(wobble(poly([[hx-40,hy],[hx,hy-16],[hx+40,hy],[hx,hy+16]],true),.4,s+2),prog(t,2.2,.6),2.2);
    strich(wobble(poly([[hx-16,hy+4],[hx+16,hy+4],[hx+16,hy+24],[hx-16,hy+24]],true),.4,s+3),prog(t,2.5,.4),1.8);
    const sw=Math.sin(t*1.8)*8;
    strich(seg([hx+40,hy],[hx+40+sw*.3,hy+30]),prog(t,2.7,.3),1.6,P.accent);
    ctx.fillStyle=P.accent;ctx.globalAlpha=prog(t,2.9,.3);ctx.beginPath();ctx.arc(hx+40+sw*.3,hy+34,4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    mass([40,272],[300,272],prog(t,3.0,.4),'BILDUNG');
  },
  zahl(t){
    const ziel=K.zahl_wert||0,v=ziel*easeOut((t-.5)/2.2),dez=(String(ziel).split('.')[1]||'').length;
    schrift((K.zahl_oben||'').toUpperCase(),26,72,{font:"700 10px 'JetBrains Mono'",farbe:P.sub,a:prog(t,.2,.4)});
    const txt=v.toLocaleString('de-DE',{minimumFractionDigits:dez,maximumFractionDigits:dez});
    schrift(txt,24,182,{font:"700 76px 'Space Grotesk'",farbe:P.accent,a:prog(t,.4,.3)});
    ctx.save();ctx.font="700 76px 'Space Grotesk'";const bw=ctx.measureText(txt).width;ctx.restore();
    schrift(K.zahl_einheit||'',32+bw,180,{font:"700 24px 'Space Grotesk'",farbe:P.ink,a:prog(t,1.2,.4)});
    const n=K.zeit_abschnitte||0,x0=26,x1=394,y=236;
    if(n){for(let i=0;i<n;i++){const a=x0+(x1-x0)*i/n+3,b=x0+(x1-x0)*(i+1)/n-3,p=prog(t,2.6+i*.18,.3);
        ctx.fillStyle=P.accent;ctx.globalAlpha=.18+.5*p;ctx.fillRect(a,y,(b-a)*p,10);ctx.globalAlpha=1}
      schrift(K.zeit_start||'',x0,y+28,{font:"500 9px 'JetBrains Mono'",farbe:P.sub,a:prog(t,2.6,.4)});
      schrift(K.zeit_ende||'',x1,y+28,{font:"500 9px 'JetBrains Mono'",farbe:P.sub,align:'right',a:prog(t,2.6+n*.18,.4)})}
    if(K.zweit_zahl){const p=prog(t,4.2,.5);ctx.save();ctx.globalAlpha=p;
      strich(seg([282,128],[306,104]),p,3,P.accent2||P.accent);strich(seg([294,104],[306,104]),p,3,P.accent2||P.accent);strich(seg([306,104],[306,116]),p,3,P.accent2||P.accent);
      schrift(K.zweit_zahl,316,122,{font:"700 24px 'Space Grotesk'",farbe:P.accent2||P.accent,a:p});
      schrift(K.zweit_label||'',316,137,{font:"500 9px 'JetBrains Mono'",farbe:P.sub,a:p});ctx.restore()}
    // Mini-Kerzenchart (26.09., Daniels Wunsch) - rein illustrativ, ohne Achsenwerte
    if(K.kerzen){const x0=300,y0=222,cw=9,gap=4,kk=[[0,4,-3,6],[4,2,-2,7],[2,6,-1,8],[6,5,-3,9],[5,9,-2,11],[9,8,-3,12],[8,11,-2,13],[11,34,-3,37]];
      kk.forEach(([o,c,lo,hi],i)=>{const p=prog(t,4.6+i*.12,.25);if(p<=0)return;const x=x0+i*(cw+gap),up=c>=o,col=up?'#22c55e':'#ef4444';
        const yo=y0-o*1.6,yc=y0-lerp(o,c,p)*1.6;ctx.strokeStyle=col;ctx.lineWidth=1;ctx.globalAlpha=p;ctx.beginPath();ctx.moveTo(x+cw/2,y0-(Math.max(o,c)+hi/4)*1.6*p-(1-p)*0);
        ctx.lineTo(x+cw/2,y0-Math.min(o,c)*1.6+Math.abs(lo)*1.2);ctx.stroke();ctx.fillStyle=col;ctx.fillRect(x,Math.min(yo,yc),cw,Math.max(2,Math.abs(yc-yo)));ctx.globalAlpha=1})}
  }
};

MOTIVE.energie=MOTIVE.turbine;
// ── Text-Ebene ───────────────────────────────────────────────────────────
const $=id=>document.getElementById(id);
$('badge').textContent=(K.badge||'BREAKING').toUpperCase();$('datum').textContent=K.datum||'';
$('titel').textContent=K.titel||'';$('quelle').innerHTML='Quelle · <b></b>';$('quelle').querySelector('b').textContent=K.quelle||'';
$('motivLabel').textContent=(K.bildzeile||'').toUpperCase();
const worte=(K.einordnung||'').split(/\s+/).filter(Boolean);
$('einordText').innerHTML=worte.map(w=>'<span>'+w.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</span>').join(' ');
const spans=[...$('einordText').querySelectorAll('span')];
// Einordnung passend machen: Schrift verkleinern, bis Titel + Box in die Textflaeche passen
(function(){const box=$('text');let f=12.5,tf=20;const ok=()=>box.scrollHeight<=box.clientHeight+1;
  while(!ok()&&f>10){f-=.5;$('einordText').style.fontSize=f+'px'}while(!ok()&&tf>16){tf-=1;$('titel').style.fontSize=tf+'px'}})();

const D=K.dauer||20, T_EIN=4.4;
window.KI_RENDER_AT=function(t){
  ctx.clearRect(0,0,W,H);grund(t);
  if(K.stil==='typo')typoSzene(t);else{(MOTIVE[K.motiv]||MOTIVE.netz)(t);markeZeichnen(t)}
  if(K.stil==='neon')neonBloom();
  const a=prog(t,.5,.6);$('titel').style.opacity=a;$('titel').style.transform='translateY('+(1-a)*10+'px)';
  $('quelle').style.opacity=prog(t,1.1,.5);
  const e=prog(t,T_EIN,.5);$('einord').style.opacity=e;$('einord').style.transform='translateY('+(1-e)*12+'px)';
  // Woerter im Takt der Stimme: gleichmaessig von T_EIN bis 2 s vor Schluss
  const fr=clamp((t-T_EIN-.3)/Math.max(1,D-T_EIN-2.3));spans.forEach((s,i)=>{s.style.opacity=i/spans.length<=fr?1:.18});
  document.querySelector('.kopf').style.opacity=prog(t,.1,.4);$('fuss').style.opacity=prog(t,1.5,.6);
  $('fort').style.width=(clamp(t/D)*100)+'%';
};
window.KI_DAUER=D;
if(!/[?&]rec=1/.test(location.search)){const t0=performance.now();(function loop(){KI_RENDER_AT(((performance.now()-t0)/1000)%(D+1));requestAnimationFrame(loop)})()}
else KI_RENDER_AT(0);
})();
</script>
