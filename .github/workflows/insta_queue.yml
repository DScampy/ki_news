name: Insta-Queue (Telegram-Button)

# Kein Webhook, kein Dauer-Server: laeuft per Cron alle 15 Min und holt ab,
# ob seit dem letzten Lauf ein "📤 Auf Instagram posten"-Button in Telegram
# gedrueckt wurde (check_insta_queue.py). Telegram haelt Updates bis 24h vor,
# ein verpasster Tick ist also kein Problem.

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeit installieren
        run: pip install requests

      - name: Telegram-Queue pruefen + ggf. posten
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 check_insta_queue.py

      - name: Offset-Datei committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Bug-Fix (02.07.26): dasselbe kaputte Muster wie in ki_news.yml vor dem
          # 02.07.-Fix - "git pull --rebase || true" + "git push || true" verschluckte
          # JEDEN Fehler. Kritisch hier: scheitert der Push, bleibt der Telegram-Offset
          # auf origin alt, der naechste Lauf (frischer Checkout) verarbeitet denselben
          # Button-Klick ERNEUT -> Doppel-Post auf Instagram. Fix: gleiche Strategie
          # wie ki_news.yml (mixed reset auf origin/main + Recommit + Retry), und bei
          # endgueltigem Scheitern SICHTBAR fehlschlagen statt still gruen.
          add_and_commit() {
            git add insta_telegram_offset.json 2>/dev/null || true
            git diff --staged --quiet || git commit -m "Insta-Queue: Telegram-Offset aktualisiert"
          }

          add_and_commit

          PUSH_OK=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              PUSH_OK=true
              break
            fi
            echo "Push-Konflikt (Versuch $attempt) - setze auf neuesten origin/main auf und committe neu."
            git fetch origin main
            git reset origin/main
            add_and_commit
            sleep 3
          done

          if [ "$PUSH_OK" != "true" ]; then
            echo "::error::Offset-Push nach 3 Versuchen fehlgeschlagen - Risiko Doppel-Post beim naechsten Lauf."
            exit 1
          fi
