<!DOCTYPE html>
<html class="dark" lang="de">
<head>
    <script src="assets/ki-bilder.js"></script>
  <script src="assets/ki-logos.js"></script>
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dossier-Lesesicht von KI News">
  <meta name="author" content="Daniel S. · @ScampyKI">
  <title>Dossier lesen · KI News</title>

  <link rel="stylesheet" href="assets/ki-fonts.css">
  <link rel="stylesheet" href="assets/ki-tw.css">
  <script src="assets/ki-icons.js" defer></script>
  <script src="assets/ki-layout.js" defer></script>

  <style>
    :root {
      --px-header: 56px;
      --px-neon-rgb: var(--neon-rgb, 0, 212, 255);
      --px-accent: var(--accent, #00d4ff);
      --px-violet: #a78bfa;
      --px-radius: 12px;
      --px-line: rgba(18, 46, 72, 0.13);
    }

    html,
    html.dark {
      color-scheme: dark;
      --px-bg: #05080d;
      --px-bg-soft: #090e16;
      --px-surface: rgba(12, 18, 27, 0.94);
      --px-surface-solid: #0c121b;
      --px-surface-raised: #111a26;
      --px-text: #eef5fb;
      --px-text-soft: #c5d1dc;
      --px-text-muted: #8395a7;
      --px-line: rgba(255, 255, 255, 0.11);
      --px-grid: rgba(255, 255, 255, 0.04);
      --px-photo-overlay: linear-gradient(90deg, rgba(5, 8, 13, 0.96), rgba(5, 8, 13, 0.7));
      --px-shadow: rgba(0, 0, 0, 0.3);
    }

    html.light {
      color-scheme: light;
      --px-bg: #edf3f7;
      --px-bg-soft: #f7fafc;
      --px-surface: rgba(255, 255, 255, 0.95);
      --px-surface-solid: #ffffff;
      --px-surface-raised: #f5f8fb;
      --px-text: #102033;
      --px-text-soft: #41546a;
      --px-text-muted: #66788b;
      --px-line: rgba(18, 46, 72, 0.13);
      --px-grid: rgba(10, 45, 75, 0.045);
      --px-photo-overlay: linear-gradient(90deg, rgba(245, 249, 252, 0.96), rgba(245, 249, 252, 0.7));
      --px-shadow: rgba(34, 63, 88, 0.13);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 0;
      background: var(--px-bg);
      scroll-behavior: smooth;
    }

    body.px-page {
      min-width: 0;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: var(--px-bg);
      color: var(--px-text);
      font-family: "Work Sans", sans-serif;
      transition: background 0.25s ease, color 0.25s ease;
    }

    button,
    a {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: inherit;
    }

    img,
    video {
      display: block;
      max-width: 100%;
    }

    [hidden] {
      display: none !important;
    }

    .px-page :focus-visible {
      outline: 2px solid var(--px-accent);
      outline-offset: 3px;
    }

    .px-page ::selection {
      color: #031017;
      background: var(--px-accent);
    }

    .px-ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 4%, rgba(var(--px-neon-rgb), 0.1), transparent 31%),
        radial-gradient(circle at 88% 18%, rgba(167, 139, 250, 0.11), transparent 33%),
        var(--px-bg);
    }

    .px-ambient::before {
      position: absolute;
      inset: 0;
      content: "";
      background-image:
        linear-gradient(var(--px-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--px-grid) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: linear-gradient(to bottom, #000, transparent 88%);
      -webkit-mask-image: linear-gradient(to bottom, #000, transparent 88%);
    }

    .px-ambient::after {
      position: absolute;
      top: -14rem;
      left: 50%;
      width: min(74rem, 92vw);
      height: 34rem;
      content: "";
      transform: translateX(-50%);
      border: 1px solid rgba(var(--px-neon-rgb), 0.12);
      border-radius: 50%;
      box-shadow:
        0 0 90px rgba(var(--px-neon-rgb), 0.07),
        inset 0 0 90px rgba(167, 139, 250, 0.035);
    }

    .px-skip {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 300;
      transform: translateY(-150%);
      padding: 9px 13px;
      border-radius: 999px;
      background: var(--px-accent);
      color: #031017;
      font-weight: 700;
      text-decoration: none;
    }

    .px-skip:focus {
      transform: translateY(0);
    }

    .px-reader-chrome {
      position: fixed;
      top: var(--px-header);
      right: 0;
      left: 0;
      z-index: 140;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      height: 52px;
      padding: 6px max(14px, calc((100vw - 1240px) / 2));
      background: var(--px-bg-soft);
      border-bottom: 1px solid var(--px-line);
      box-shadow: 0 10px 30px var(--px-shadow);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
    }

    .px-back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 7px 11px;
      border: 1px solid rgba(var(--px-neon-rgb), 0.2);
      border-radius: 999px;
      background: rgba(var(--px-neon-rgb), 0.05);
      color: var(--px-text-soft);
      font-family: "Space Grotesk", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-decoration: none;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .px-back-link::before {
      content: "←";
      color: var(--px-accent);
      font-size: 15px;
      line-height: 1;
    }

    .px-back-link:hover {
      border-color: rgba(var(--px-neon-rgb), 0.5);
      background: rgba(var(--px-neon-rgb), 0.1);
      color: var(--px-text);
    }

    .px-chapter-strip {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scrollbar-width: none;
    }

    .px-chapter-strip::-webkit-scrollbar {
      display: none;
    }

    .px-chapter-button {
      flex: 0 0 auto;
      max-width: 190px;
      overflow: hidden;
      padding: 7px 11px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--px-text-muted);
      cursor: pointer;
      font-family: "Space Grotesk", sans-serif;
      font-size: 11px;
      font-weight: 650;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .px-chapter-button:hover {
      border-color: rgba(var(--px-neon-rgb), 0.18);
      color: var(--px-text);
    }

    .px-chapter-button[aria-current="step"] {
      border-color: var(--px-accent);
      background: var(--px-accent);
      color: #041117;
      box-shadow: 0 0 18px rgba(var(--px-neon-rgb), 0.22);
    }

    .px-reader-count {
      color: var(--px-text-muted);
      font: 10px/1 monospace;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .px-reader-progress {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--px-accent), var(--px-violet));
      box-shadow: 0 0 12px rgba(var(--px-neon-rgb), 0.6);
      pointer-events: none;
    }

    .px-reader-main {
      position: relative;
      z-index: 1;
      width: 100%;
      min-width: 0;
      padding-top: calc(var(--px-header) + 70px);
    }

    .px-state {
      width: min(760px, calc(100% - 32px));
      margin: 12vh auto 0;
      padding: 30px;
      border: 1px solid rgba(var(--px-neon-rgb), 0.18);
      border-radius: var(--px-radius);
      background: var(--px-surface);
      box-shadow:
        0 0 0 1px rgba(var(--px-neon-rgb), 0.035),
        0 22px 70px var(--px-shadow),
        0 0 38px rgba(var(--px-neon-rgb), 0.06);
    }

    .px-state-kicker {
      display: block;
      margin-bottom: 12px;
      color: var(--px-accent);
      font: 10px/1.2 monospace;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .px-state h1,
    .px-state h2 {
      margin: 0;
      color: var(--px-text);
      font-family: "Space Grotesk", sans-serif;
      line-height: 1.12;
    }

    .px-state h1 {
      font-size: clamp(30px, 6vw, 52px);
    }

    .px-state p {
      max-width: 64ch;
      margin: 18px 0 0;
      color: var(--px-text-soft);
      font-size: 16px;
      line-height: 1.7;
    }

    .px-loader {
      width: 42px;
      height: 42px;
      margin-bottom: 24px;
      border: 1px solid rgba(var(--px-neon-rgb), 0.14);
      border-top-color: var(--px-accent);
      border-radius: 50%;
      animation: px-spin 0.9s linear infinite;
    }

    .px-state-button {
      display: inline-flex;
      margin-top: 22px;
      padding: 10px 15px;
      border: 1px solid rgba(var(--px-neon-rgb), 0.36);
      border-radius: 999px;
      background: rgba(var(--px-neon-rgb), 0.1);
      color: var(--px-text);
      cursor: pointer;
      font-family: "Space Grotesk", sans-serif;
      font-size: 12px;
      font-weight: 700;
    }

    @keyframes px-spin {
      to { transform: rotate(360deg); }
    }

    .px-dossier-intro {
      position: relative;
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 38px 0 48px;
    }

    .px-dossier-intro::before {
      position: absolute;
      top: -12%;
      left: 50%;
      z-index: -1;
      width: min(780px, 90vw);
      aspect-ratio: 1;
      content: "";
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--px-neon-rgb), 0.1), transparent 67%);
      filter: blur(12px);
      pointer-events: none;
    }

    .px-intro-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(240px, 0.55fr);
      align-items: center;
      gap: 54px;
    }

    .px-eyebrow {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .px-pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 5px 10px;
      border: 1px solid rgba(var(--px-neon-rgb), 0.22);
      border-radius: 999px;
      background: rgba(var(--px-neon-rgb), 0.07);
      color: var(--px-accent);
      font-family: "Space Grotesk", sans-serif;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.1em;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .px-pill-violet {
      border-color: rgba(167, 139, 250, 0.28);
      background: rgba(167, 139, 250, 0.08);
      color: #c4b5fd;
    }

    html.light .px-pill-violet {
      color: #6d42c8;
    }

    .px-dossier-intro h1 {
      max-width: 850px;
      margin: 0;
      color: var(--px-text);
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(36px, 5.2vw, 66px);
      font-weight: 700;
      letter-spacing: -0.055em;
      line-height: 0.98;
      text-wrap: balance;
      overflow-wrap: anywhere;
    }

    .px-dossier-lead {
      max-width: 730px;
      margin: 23px 0 0;
      color: var(--px-text-soft);
      font-size: clamp(16px, 1.7vw, 19px);
      line-height: 1.58;
      text-wrap: pretty;
      overflow-wrap: anywhere;
    }

    .px-dossier-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 16px;
      max-width: 820px;
      margin: 25px 0 0;
      padding: 13px 0;
      border-top: 1px solid var(--px-line);
      border-bottom: 1px solid var(--px-line);
      color: var(--px-text-muted);
      font: 10px/1.4 monospace;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .px-dossier-start {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 20px;
      padding: 9px 15px;
      border: 1px solid rgba(var(--px-neon-rgb), 0.26);
      border-radius: 999px;
      background: rgba(var(--px-neon-rgb), 0.08);
      color: var(--px-accent);
      cursor: pointer;
      font-family: "Space Grotesk", sans-serif;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .px-dossier-start::after {
      content: "↓";
      font-size: 14px;
    }

    .px-dossier-start:hover {
      background: rgba(var(--px-neon-rgb), 0.14);
      box-shadow: 0 0 24px rgba(var(--px-neon-rgb), 0.1);
    }

    .px-line-map {
      position: relative;
      min-height: 240px;
      padding: 22px;
      overflow: hidden;
      border: 1px solid rgba(var(--px-neon-rgb), 0.2);
      border-radius: var(--px-radius);
      background:
        linear-gradient(135deg, rgba(var(--px-neon-rgb), 0.09), transparent 46%),
        var(--px-surface);
      box-shadow:
        0 0 0 1px rgba(var(--px-neon-rgb), 0.035),
        0 20px 55px var(--px-shadow),
        0 0 32px rgba(var(--px-neon-rgb), 0.06);
    }

    .px-line-map::before {
      position: absolute;
      inset: 0;
      content: "";
      background-image:
        linear-gradient(var(--px-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--px-grid) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(135deg, #000, transparent 75%);
      -webkit-mask-image: linear-gradient(135deg, #000, transparent 75%);
    }

    .px-map-label {
      position: relative;
      color: var(--px-text-muted);
      font: 9px/1.2 monospace;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .px-map-visual {
      position: relative;
      height: 112px;
      margin: 17px 0 12px;
    }

    .px-map-visual::before {
      position: absolute;
      top: 53px;
      right: 8%;
      left: 8%;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, var(--px-accent), var(--px-violet));
      box-shadow: 0 0 15px rgba(var(--px-neon-rgb), 0.55);
      transform: rotate(-11deg);
    }

    .px-map-node {
      position: absolute;
      top: 35px;
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border: 1px solid var(--px-accent);
      border-radius: 50%;
      background: var(--px-surface-solid);
      color: var(--px-accent);
      font: 10px/1 monospace;
      box-shadow: 0 0 17px rgba(var(--px-neon-rgb), 0.2);
    }

    .px-map-node:nth-child(1) { left: 5%; }
    .px-map-node:nth-child(2) { left: 34%; top: 19px; border-color: var(--px-violet); color: var(--px-violet); }
    .px-map-node:nth-child(3) { left: 65%; top: 42px; }
    .px-map-node:nth-child(4) { right: 4%; top: 14px; border-color: var(--px-violet); color: var(--px-violet); }

    .px-map-count {
      position: relative;
      color: var(--px-text);
      font: 700 34px/1 "Space Grotesk", sans-serif;
      letter-spacing: -0.05em;
    }

    .px-map-caption {
      position: relative;
      margin-top: 7px;
      color: var(--px-text-muted);
      font: 10px/1.45 monospace;
    }

    .px-chapter {
      position: relative;
      isolation: isolate;
      min-height: 440px;
      overflow: hidden;
      border-top: 1px solid var(--px-line);
      scroll-margin-top: calc(var(--px-header) + 64px);
    }

    .px-chapter::after {
      position: absolute;
      right: max(22px, calc((100vw - 1120px) / 2));
      bottom: 0;
      left: max(22px, calc((100vw - 1120px) / 2));
      z-index: 3;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, transparent, rgba(var(--px-neon-rgb), 0.24), transparent);
    }

    .px-chapter-photo {
      position: absolute;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      background: var(--px-bg-soft);
    }

    .px-photo-fallback {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 78% 25%, rgba(var(--px-neon-rgb), 0.18), transparent 29%),
        radial-gradient(circle at 15% 80%, rgba(167, 139, 250, 0.18), transparent 30%),
        var(--px-bg-soft);
    }

    .px-photo-fallback::before {
      position: absolute;
      inset: 0;
      content: "";
      background-image:
        linear-gradient(var(--px-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--px-grid) 1px, transparent 1px);
      background-size: 56px 56px;
      transform: perspective(500px) rotateX(58deg) scale(1.4);
      transform-origin: center bottom;
    }

    .px-photo-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.64;
      filter: saturate(0.82) contrast(1.05);
      transform: scale(1.035);
      transition: transform 1.1s ease, opacity 0.6s ease, filter 1.1s ease;
    }

    .px-chapter.is-visible .px-photo-image {
      opacity: 0.8;
      filter: saturate(0.9) contrast(1.04);
      transform: scale(1);
    }

    .px-photo-shade {
      position: absolute;
      inset: 0;
      background: var(--px-photo-overlay);
    }

    .px-photo-index {
      position: absolute;
      right: max(20px, calc((100vw - 1120px) / 2));
      bottom: 30px;
      color: rgba(255, 255, 255, 0.16);
      font: 700 clamp(76px, 12vw, 154px) / 0.8 "Space Grotesk", sans-serif;
      letter-spacing: -0.07em;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.14);
      pointer-events: none;
    }

    .px-photo-credit {
      position: absolute;
      right: max(20px, calc((100vw - 1120px) / 2));
      bottom: 18px;
      z-index: 1;
      max-width: 280px;
      color: rgba(255, 255, 255, 0.52);
      font: 9px/1.4 monospace;
      letter-spacing: 0.04em;
      text-align: right;
      pointer-events: none;
    }

    .px-chapter-inner {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 44px 0 58px;
    }

    .px-chapter-heading {
      max-width: 860px;
      margin: 0 auto 17px;
      text-align: center;
    }

    .px-chapter-kicker {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 11px;
      color: var(--px-accent);
      font: 10px/1.2 monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .px-chapter-kicker::before,
    .px-chapter-kicker::after {
      width: 22px;
      height: 1px;
      content: "";
      background: rgba(var(--px-neon-rgb), 0.42);
    }

    .px-chapter-heading h2 {
      margin: 0;
      color: var(--px-text);
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(29px, 4.1vw, 48px);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.04;
      text-wrap: balance;
      overflow-wrap: anywhere;
      text-shadow: 0 2px 28px rgba(0, 0, 0, 0.16);
    }

    .px-chapter-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 224px;
      align-items: start;
      gap: 16px;
      min-width: 0;
      max-width: 1000px;
      margin: 0 auto;
    }

    .px-chapter-layout.px-no-media {
      grid-template-columns: minmax(0, 800px);
      justify-content: center;
    }

    .px-event-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(var(--px-neon-rgb), 0.18);
      border-radius: var(--px-radius);
      background: var(--px-surface);
      box-shadow:
        0 0 0 1px rgba(var(--px-neon-rgb), 0.035),
        0 24px 60px var(--px-shadow),
        0 0 34px rgba(var(--px-neon-rgb), 0.05);
      backdrop-filter: blur(16px) saturate(125%);
      -webkit-backdrop-filter: blur(16px) saturate(125%);
    }

    .px-event-signal {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      padding: 12px 22px;
      border-bottom: 1px solid var(--px-line);
      background: rgba(var(--px-neon-rgb), 0.045);
    }

    .px-event-source {
      min-width: 0;
      overflow: hidden;
      color: var(--px-text-soft);
      font: 10px/1.3 monospace;
      letter-spacing: 0.07em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .px-event-date {
      color: var(--px-text-muted);
      font: 10px/1.3 monospace;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .px-event-copy {
      min-width: 0;
      padding: 25px 28px 19px;
      color: var(--px-text-soft);
      font-size: clamp(16px, 1.55vw, 18px);
      line-height: 1.73;
      overflow-wrap: anywhere;
    }

    .px-event-copy p {
      margin: 0 0 1.05em;
    }

    .px-event-copy p:first-child {
      color: var(--px-text);
      font-size: 1.07em;

<body class="px-page">
  <a class="px-skip" href="#px-dossier-content">Zum Dossier</a>
  <div class="px-ambient" aria-hidden="true"></div>

  <nav class="px-reader-chrome" aria-label="Dossier-Navigation">
    <a class="px-back-link" href="dossiers.html">Zurück zur Übersicht</a>
    <div class="px-chapter-strip" id="px-chapter-strip" aria-label="Kapitel"></div>
    <span class="px-reader-count" id="px-reader-count">00 / 00</span>
    <span class="px-reader-progress" id="px-reader-progress" aria-hidden="true"></span>
  </nav>

  <main class="px-reader-main" id="px-dossier-content" tabindex="-1">
    <section class="px-state" id="px-state" role="status" aria-live="polite">
      <div class="px-loader" aria-hidden="true"></div>
      <span class="px-state-kicker">Dossier wird aufgebaut</span>
      <h1>Entwicklungen werden geladen.</h1>
      <p>Die Kapitel folgen den einzelnen Ereignissen. Quellenbilder und Videokarten werden nach und nach ergänzt.</p>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var root = document.documentElement;
      var main = document.getElementById("px-dossier-content");
      var state = document.getElementById("px-state");
      var chapterStrip = document.getElementById("px-chapter-strip");
      var readerCount = document.getElementById("px-reader-count");
      var readerProgress = document.getElementById("px-reader-progress");

      var chapterRefs = [];
      var chapterButtons = [];
      var currentCards = [];
      var currentArticles = [];
      var activeChapter = -2;
      var updateTimer = 0;
      var scrollBound = false;
      var newsData = null;
      var newsPromise = null;
      var enrichmentStarted = false;

      var stopWords = new Set([
        "aber", "alle", "auch", "dass", "dem", "der", "des", "die", "ein", "eine",
        "einen", "einem", "eines", "für", "gegen", "im", "in", "ist", "mit", "nach",
        "sich", "sie", "und", "von", "vor", "über", "zum", "zur"
      ]);

      function make(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = cleanText(text);
        return node;
      }

      function cleanText(value) {
        return String(value == null ? "" : value)
          .replace(/\u2014/g, "-")
          .replace(/\u2013/g, "-")
          .replace(/\r/g, "")
          .replace(/[ \t]+/g, " ")
          .trim();
      }

      function asObject(value) {
        return value && typeof value === "object" && !Array.isArray(value) ? value : {};
      }

      function asArray(value) {
        return Array.isArray(value) ? value : [];
      }

      function safeUrl(value) {
        if (!value) return "";
        try {
          var parsed = new URL(String(value), window.location.href);
          return parsed.protocol === "http:" || parsed.protocol === "https:" ? parsed.href : "";
        } catch (error) {
          return "";
        }
      }

      function formatDate(value) {
        var raw = cleanText(value);
        if (!raw) return "Datum nicht angegeben";

        var match = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (!match) return raw;

        try {
          return new Date(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
          ).toLocaleDateString("de-DE", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
          });
        } catch (error) {
          return raw;
        }
      }

      function normalize(value) {
        return cleanText(value)
          .toLocaleLowerCase("de-DE")
          .replace(/ß/g, "ss")
          .replace(/[^a-z0-9äöü\s-]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function tokens(value) {
        return normalize(value).split(" ").filter(function (word) {
          return word.length > 2 && !stopWords.has(word);
        });
      }

      function titleScore(first, second) {
        var a = tokens(first);
        var b = tokens(second);
        if (!a.length || !b.length) return 0;

        var setB = new Set(b);
        var overlap = a.filter(function (word) { return setB.has(word); }).length;
        var union = new Set(a.concat(b)).size;
        return union ? overlap / union : 0;
      }

      function fetchJSON(path, timeoutMs) {
        var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
        var timer = window.setTimeout(function () {
          if (controller) controller.abort();
        }, timeoutMs || 9000);

        return fetch(path, {
          cache: "no-store",
          credentials: "same-origin",
          signal: controller ? controller.signal : undefined
        })
          .then(function (response) {
            if (!response.ok) throw new Error("HTTP " + response.status);
            return response.json();
          })
          .then(function (data) {
            window.clearTimeout(timer);
            return data;
          })
          .catch(function (error) {
            window.clearTimeout(timer);
            throw error;
          });
      }

      function getDossierId() {
        var match = window.location.hash.match(/(?:^|[#&])l=([^&]+)/);
        if (!match) return "";
        try {
          return decodeURIComponent(match[1]);
        } catch (error) {
          return cleanText(match[1]);
        }
      }

      function getEntries(line) {
        return asArray(asObject(line).e).filter(function (entry) {
          return entry && typeof entry === "object" && !Array.isArray(entry);
        });
      }

      function availableDossiers(data) {
        var lines = asObject(asObject(data).linien);
        return Object.keys(lines).filter(function (key) {
          return getEntries(lines[key]).length > 0;
        });
      }

      function createImage() {
        var image = make("img", "px-photo-image");
        image.alt = "";
        image.loading = "lazy";
        image.decoding = "async";
        return image;
      }

      function setChapterImage(ref, article) {
        var imageUrl = safeUrl(asObject(article).image) || safeUrl(asObject(ref.event).image);
        if (!imageUrl) return;

        var image = createImage();
        image.addEventListener("error", function () {
          image.remove();
        }, { once: true });

        image.src = imageUrl;

        ref.photo.replaceChildren(
          make("div", "px-photo-fallback"),
          image,
          make("div", "px-photo-shade"),
          make("span", "px-photo-index", ref.indexLabel),
          make("span", "px-photo-credit", "Quellbild: " + cleanText(article.source || ref.event.q || "Unbekannte Quelle"))
        );
      }

      function findSourceArticle(event) {
        if (!event || !currentArticles.length) return null;

        var eventLink = safeUrl(event.l);
        var best = null;
        var bestScore = 0;

        currentArticles.forEach(function (article) {
          if (!article || typeof article !== "object") return;

          var score = titleScore(event.t, article.title) * 18;
          var link = safeUrl(article.link);
          var dub = safeUrl(article.dub_von);

          if (eventLink && (link === eventLink || dub === eventLink)) score += 100;
          if (event.d === article.date) score += 0.8;
          if (safeUrl(article.image)) score += 0.45;

          if (score > bestScore) {
            bestScore = score;
            best = article;
          }
        });

        return bestScore >= 2 ? best : null;
      }

      function findCard(event) {
        if (!event || !currentCards.length) return null;

        var eventLink = safeUrl(event.l);
        var best = null;
        var bestScore = 0;

        currentCards.forEach(function (card) {
          if (!card || typeof card !== "object") return;

          var score = titleScore(event.t, card.headline) * 20;
          var links = asArray(card.links).map(safeUrl);

          if (eventLink && links.indexOf(eventLink) !== -1) score += 1000;
          if (event.d === card.date) score += 0.3;

          if (score > bestScore) {
            bestScore = score;
            best = card;
          }
        });

        // 28.09.26: nur gleicher Link oder deutlich gleicher Titel (vorher reichte ~1/8 Wortueberlapp)
        return bestScore >= 12 ? best : null;
      }

      function formatDuration(value) {
        var seconds = Number(value);
        if (!Number.isFinite(seconds) || seconds <= 0) return "";

        var minutes = Math.floor(seconds / 60);
        var rest = Math.round(seconds % 60);
        return minutes + ":" + String(rest).padStart(2, "0");
      }

      function applyCard(ref, card) {
        var mp4Url = safeUrl(asObject(card).mp4_url);

        if (!mp4Url) {
          ref.layout.classList.add("px-no-media");
          ref.media.replaceChildren();
          return;
        }

        ref.layout.classList.remove("px-no-media");
        ref.media.replaceChildren();

        var label = make("span", "px-media-label", "Karten-Video");
        var button = make("button", "px-media-load");
        var posterUrl = safeUrl(card.poster_url);
        var captionText = cleanText(card.headline || card.einordnung || "Kurze Einordnung");
        var duration = formatDuration(card.duration);

        button.type = "button";
        button.setAttribute(
          "aria-label",
          "Video mit Ton laden und abspielen: " +
          cleanText(card.headline || card.einordnung || "Karteneinordnung")
        );

        if (posterUrl) {
          var poster = make("img");
          poster.alt = "";
          poster.loading = "lazy";
          poster.decoding = "async";
          poster.addEventListener("error", function () {
            poster.remove();
          }, { once: true });
          poster.src = posterUrl;
          button.appendChild(poster);
        }

        var play = make("span", "px-media-play", "▶");
        play.setAttribute("aria-hidden", "true");
        if (duration) captionText += " · " + duration;

        var caption = make("span", "px-media-caption", captionText);
        button.append(play, caption);
        ref.media.append(label, button);

        button.addEventListener("click", function () {
          var video = make("video", "px-media-player");
          video.controls = true;
          video.playsInline = true;
          video.preload = "metadata";
          video.muted = false;
          video.volume = 1;
          video.setAttribute("aria-label", "Karten-Video: " + cleanText(card.headline || "Einordnung"));

          if (posterUrl) video.poster = posterUrl;

          var source = document.createElement("source");
          source.src = mp4Url;
          source.type = "video/mp4";
          video.appendChild(source);

          var note = make("p", "px-media-note", "Ton ist eingeschaltet. Die Wiedergabe startet nach dem Klick.");
          ref.media.replaceChildren(video, note);
          video.load();

          var playPromise = video.play();
          if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(function () {
              note.textContent = "Die Videodatei ist bereit. Bitte Start im Player wählen.";
            });
          }

          video.addEventListener("error", function () {
            ref.layout.classList.add("px-no-media");
            ref.media.replaceChildren();
          }, { once: true });
        }, { once: true });
      }

      function splitText(value) {
        var normalized = cleanText(value);
        if (!normalized) return [];

        return normalized
          .replace(/([.!?])\s+(?=[A-ZÄÖÜ„“])/g, "$1\n\n")
          .split(/\n{2,}/)
          .map(cleanText)
          .filter(Boolean);
      }

      function fillEventCopy(ref) {
        var text = cleanText(ref.event.z);

        if (text.length < 80 && ref.sourceArticle) {
          text = cleanText(ref.sourceArticle.summary) || cleanText(ref.sourceArticle.full_text);
        }

        ref.copy.replaceChildren();

        var paragraphs = splitText(text);
        if (!paragraphs.length) {
          ref.copy.appendChild(make("p", "", "Für dieses Ereignis liegt derzeit kein ausführlicher Text vor."));
          return;
        }

        paragraphs.forEach(function (paragraph) {
          ref.copy.appendChild(make("p", "", paragraph));
        });
      }

      function shortenLabel(value, maxLength) {
        var text = cleanText(value).replace(/[.!?]+$/, "");
        if (text.length <= maxLength) return text;
        return text.slice(0, maxLength - 1).trim() + "…";
      }

      function createChapter(event, index, total) {
        var section = make("section", "px-chapter");
        var id = "px-kapitel-" + (index + 1);
        var indexLabel = String(index + 1).padStart(2, "0");

        section.id = id;
        section.dataset.chapterIndex = String(index);
        section.setAttribute("aria-labelledby", id + "-titel");

        var photo = make("div", "px-chapter-photo");
        var fallback = make("div", "px-photo-fallback");
        var shade = make("div", "px-photo-shade");
        var photoIndex = make("span", "px-photo-index", indexLabel);
        fallback.setAttribute("aria-hidden", "true");
        photoIndex.setAttribute("aria-hidden", "true");
        photo.append(fallback, shade, photoIndex);

        var inner = make("div", "px-chapter-inner");
        var heading = make("div", "px-chapter-heading");
        var kicker = make("span", "px-chapter-kicker", "Ereignis " + indexLabel + " von " + String(total).padStart(2, "0"));
        var title = make("h2", "", event.t || "Ohne Ereignistitel");
        title.id = id + "-titel";
        title.tabIndex = -1;
        heading.append(kicker, title);

        var layout = make("div", "px-chapter-layout px-no-media");
        var eventCard = make("article", "px-event-card");
        var signal = make("div", "px-event-signal");
        var source = make("span", "px-event-source", event.q || "Quelle nicht angegeben");
        var date = make("span", "px-event-date", formatDate(event.d));
        var copy = make("div", "px-event-copy");
        var articleUrl = safeUrl(event.l);
        var sourceLink = articleUrl
          ? make("a", "px-source-link", "Originalmeldung öffnen")
          : make("div", "px-source-link", "Originalmeldung derzeit nicht verlinkt");

        signal.append(source, date);

        if (articleUrl) {
          sourceLink.href = articleUrl;
          sourceLink.target = "_blank";
          sourceLink.rel = "noopener noreferrer";
        } else {
          sourceLink.setAttribute("aria-disabled", "true");
        }

        eventCard.append(signal, copy, sourceLink);

        var media = make("aside", "px-media-rail");
        media.setAttribute("aria-label", "Optionale Karte zum Ereignis");

        layout.append(eventCard, media);
        inner.append(heading, layout);
        section.append(photo, inner);

        var ref = {
          section: section,
          event: event,
          photo: photo,
          layout: layout,
          copy: copy,
          media: media,
          index: index,
          indexLabel: indexLabel,
          sourceArticle: null,
          cardResolved: false,
          card: null
        };

        fillEventCopy(ref);
        return ref;
      }

      function createIntro(line, lineId, entries) {
        var section = make("section", "px-dossier-intro");
        var grid = make("div", "px-intro-grid");
        var left = make("div", "");
        var right = make("div", "");
        var dossier = asObject(line.dossier);
        var eyebrow = make("div", "px-eyebrow");
        var title = make("h1", "", dossier.titel || "Dossier ohne Titel");
        var lead = make("p", "px-dossier-lead", dossier.worum || "Zu diesem Dossier liegt derzeit keine Einleitung vor.");
        var meta = make("div", "px-dossier-meta");
        var start = make("button", "px-dossier-start", "Zum ersten Ereignis");

        eyebrow.append(
          make("span", "px-pill", "Dossier"),
          make("span", "px-pill px-pill-violet", entries.length + " Ereignisse")
        );

        meta.append(
          make("span", "", "Linie " + lineId),
          make("span", "", "Seit " + formatDate(line.seit)),
          make("span", "", entries.length + " Kapitel")
        );

        start.type = "button";
        start.addEventListener("click", function () {
          if (chapterRefs[0]) {
            chapterRefs[0].section.scrollIntoView({
              behavior: reducedMotion() ? "auto" : "smooth",
              block: "start"
            });
          }
        });

        left.append(eyebrow, title, lead, meta, start);

        var map = make("div", "px-line-map");
        var mapLabel = make("div", "px-map-label", "Linienbild");
        var mapVisual = make("div", "px-map-visual");
        mapVisual.append(
          make("span", "px-map-node", "01"),
          make("span", "px-map-node", "02"),
          make("span", "px-map-node", "03"),
          make("span", "px-map-node", "04")
        );
        var mapCount = make("div", "px-map-count", String(entries.length).padStart(2, "0"));
        var mapCaption = make("div", "px-map-caption", "Ereignisse mit Verbindung");
        map.append(mapLabel, mapVisual, mapCount, mapCaption);
        right.append(map);

        grid.append(left, right);
        section.append(grid);
        return section;
      }

      function createEnd() {
        var section = make("section", "px-end");
        var inner = make("div", "px-end-inner");
        var mark = make("div", "px-end-mark", "S");
        var heading = make("h2", "", "Ende des Dossiers");
        var text = make("p", "", "Daniel S. · Scampy. Kuratiert, eingeordnet und auf Deutsch erklärt.");
        var actions = make("div", "px-end-actions");
        var back = make("a", "px-end-button", "Zurück zur Linien-Übersicht");
        var top = make("button", "px-end-button", "Wieder nach oben");

        back.href = "dossiers.html";
        top.type = "button";
        top.addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: reducedMotion() ? "auto" : "smooth" });
        });

        actions.append(back, top);
        inner.append(mark, heading, text, actions);
        section.appendChild(inner);
        return section;
      }

      function reducedMotion() {
        return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      }

      function updateProgress() {
        var max = Math.max(0, root.scrollHeight - window.innerHeight);
        var percent = max > 0 ? Math.min(100, (window.scrollY / max) * 100) : 0;
        readerProgress.style.width = percent.toFixed(2) + "%";
      }

      function setActiveChapter(index) {
        if (index === activeChapter) return;
        activeChapter = index;

        chapterButtons.forEach(function (button, buttonIndex) {
          if (buttonIndex === index) {
            button.setAttribute("aria-current", "step");
          } else {
            button.removeAttribute("aria-current");
          }
        });

        if (index >= 0) {
          var button = chapterButtons[index];
          if (button && typeof chapterStrip.scrollTo === "function") {
            var target = button.offsetLeft - (chapterStrip.clientWidth - button.offsetWidth) / 2;
            chapterStrip.scrollTo({
              left: Math.max(0, target),
              behavior: reducedMotion() ? "auto" : "smooth"
            });
          }
        }

        readerCount.textContent =
          String(Math.max(0, index + 1)).padStart(2, "0") +
          " / " +
          String(chapterRefs.length).padStart(2, "0");
      }

      function updateReaderPosition() {
        updateProgress();

        if (!chapterRefs.length) {
          setActiveChapter(-1);
          return;
        }

        var marker = window.innerHeight * 0.34;
        var index = -1;

        chapterRefs.forEach(function (ref, refIndex) {
          var rect = ref.section.getBoundingClientRect();
          if (rect.top <= marker) index = refIndex;
          if (rect.top <= marker && rect.bottom > marker) ref.section.classList.add("is-visible");
        });

        if (window.innerHeight + window.scrollY >= root.scrollHeight - 4) {
          index = chapterRefs.length - 1;
        }

        setActiveChapter(index);
      }

      function requestReaderUpdate() {
        if (updateTimer) return;
        var raf = window.requestAnimationFrame || function (callback) {
          return window.setTimeout(callback, 16);
        };

        updateTimer = raf(function () {
          updateTimer = 0;
          updateReaderPosition();
        });
      }

      function bindReaderTracking() {
        if (!scrollBound) {
          window.addEventListener("scroll", requestReaderUpdate, { passive: true });
          window.addEventListener("resize", requestReaderUpdate, { passive: true });
          scrollBound = true;
        }
        requestReaderUpdate();
      }

      function refreshEnhancements() {
        chapterRefs.forEach(function (ref) {
          if (!ref.sourceArticle) {
            ref.sourceArticle = findSourceArticle(ref.event);
            if (ref.sourceArticle) {
              setChapterImage(ref, ref.sourceArticle);
              if (cleanText(ref.event.z).length < 80) fillEventCopy(ref);
            }
          }

          if (!ref.cardResolved && currentCards.length) {
            ref.cardResolved = true;
            ref.card = findCard(ref.event);
            applyCard(ref, ref.card);
          }
        });
      }

      function showMissingDossier(requestedId, ids) {
        chapterStrip.replaceChildren();
        readerCount.textContent = "00 / 00";
        readerProgress.style.width = "0%";

        state.hidden = false;
        state.className = "px-state";
        state.replaceChildren(
          make("span", "px-state-kicker", "Dossier nicht gefunden"),
          make("h1", "", "Diese Linie ist nicht verfügbar."),
          make("p", "", requestedId
            ? "Für die Kennung " + requestedId + " wurden keine Ereignisse gefunden."
            : "Es konnte kein gültiges Dossier geöffnet werden.")
        );

        if (ids.length) {
          var button = make("button", "px-state-button", "Erstes verfügbares Dossier öffnen");
          button.type = "button";
          button.addEventListener("click", function () {
            window.location.hash = "l=" + encodeURIComponent(ids[0]);
          });
          state.appendChild(button);
        }
      }

      function showLoadError() {
        chapterStrip.replaceChildren();
        readerCount.textContent = "00 / 00";
        readerProgress.style.width = "0%";

        state.hidden = false;
        state.className = "px-state";
        state.replaceChildren(
          make("span", "px-state-kicker", "Daten nicht erreichbar"),
          make("h1", "", "Das Dossier konnte nicht geladen werden."),
          make("p", "", "Die Datei news.json ist nicht erreichbar oder nicht gültig. Bitte prüfe den Serverpfad und versuche es erneut.")
        );

        var retry = make("button", "px-state-button", "Erneut versuchen");
        retry.type = "button";
        retry.addEventListener("click", function () {
          newsPromise = null;
          loadNews();
        });
        state.appendChild(retry);
      }

      function renderDossier(data) {
        var lines = asObject(asObject(data).linien);
        var ids = availableDossiers(data);
        var requestedId = getDossierId();
        var selectedId = requestedId && Object.prototype.hasOwnProperty.call(lines, requestedId) && getEntries(lines[requestedId]).length
          ? requestedId
          : ids[0] || "";

        if (!selectedId || !getEntries(lines[selectedId]).length) {
          showMissingDossier(requestedId, ids);
          return;
        }

        try {
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, "", "#l=" + encodeURIComponent(selectedId));
          }
        } catch (error) {
          if (window.location.hash !== "#l=" + encodeURIComponent(selectedId)) {
            window.location.hash = "l=" + encodeURIComponent(selectedId);
          }
        }

        var line = asObject(lines[selectedId]);
        var dossier = asObject(line.dossier);
        var events = getEntries(line);

        chapterRefs = [];
        chapterButtons = [];
        activeChapter = -2;
        currentArticles = asArray(data && data.news);

        document.title = cleanText(dossier.titel || "Dossier lesen") + " · KI News";
        var description = document.querySelector('meta[name="description"]');
        if (description) description.content = cleanText(dossier.worum || "Dossier-Lesesicht");

        var fragment = document.createDocumentFragment();
        fragment.appendChild(createIntro(line, selectedId, events));
        chapterStrip.replaceChildren();

        events.forEach(function (event, index) {
          var button = make(
            "button",
            "px-chapter-button",
            String(index + 1).padStart(2, "0") + " · " + shortenLabel(event.t || "Ereignis", 24)
          );

          button.type = "button";
          button.title = cleanText(event.t || "Ereignis");
          button.addEventListener("click", function () {
            var ref = chapterRefs[index];
            if (!ref) return;

            ref.section.scrollIntoView({
              behavior: reducedMotion() ? "auto" : "smooth",
              block: "start"
            });

            window.setTimeout(function () {
              var title = ref.section.querySelector("h2");
              if (title) title.focus({ preventScroll: true });
            }, reducedMotion() ? 0 : 380);
          });

          chapterButtons.push(button);
          chapterStrip.appendChild(button);
          chapterRefs.push(createChapter(event, index, events.length));
          fragment.appendChild(chapterRefs[index].section);
        });

        fragment.appendChild(createEnd());
        main.replaceChildren(fragment);

        readerCount.textContent = "00 / " + String(chapterRefs.length).padStart(2, "0");
        refreshEnhancements();
        bindReaderTracking();
      }

      function mergeArticles(first, second) {
        var seen = new Set();
        var result = [];

        asArray(first).concat(asArray(second)).forEach(function (article) {
          if (!article || typeof article !== "object") return;
          var link = safeUrl(article.link);
          var key = link || cleanText(article.title) + "|" + cleanText(article.date);
          if (key && seen.has(key)) return;
          if (key) seen.add(key);
          result.push(article);
        });

        return result;
      }

      function loadEnrichments() {
        if (enrichmentStarted) return;
        enrichmentStarted = true;

        Promise.all([
          fetchJSON("cards.json", 9000).catch(function () { return []; }),
          fetchJSON("archive.json", 11000).catch(function () { return []; })
        ])
          .then(function (results) {
            currentCards = asArray(results[0]);
            currentArticles = mergeArticles(newsData && newsData.news, results[1]);
            refreshEnhancements();
          })
          .catch(function () {
            refreshEnhancements();
          });
      }

      function loadNews() {
        if (newsPromise) return newsPromise;

        state.hidden = false;
        state.className = "px-state";
        state.replaceChildren(
          make("div", "px-loader"),
          make("span", "px-state-kicker", "Dossier wird aufgebaut"),
          make("h1", "", "Entwicklungen werden geladen."),
          make("p", "", "Die Kapitel folgen den einzelnen Ereignissen. Quellenbilder und Videokarten werden nach und nach ergänzt.")
        );

        newsPromise = fetchJSON("news.json", 9000)
          .then(function (data) {
            newsData = data;
            currentArticles = asArray(data && data.news);
            renderDossier(data);
            loadEnrichments();
            return data;
          })
          .catch(function (error) {
            newsPromise = null;
            showLoadError();
            throw error;
          });

        newsPromise.catch(function () { return null; });
        return newsPromise;
      }

      function syncHeaderOffset() {
        var candidates = [
          document.getElementById("site-header"),
          document.getElementById("ki-header"),
          document.querySelector("body > header"),
          document.querySelector("body > nav.fixed")
        ].filter(Boolean);

        var fixedHeader = candidates.find(function (node) {
          var style = window.getComputedStyle(node);
          return style.position === "fixed" && node.getBoundingClientRect().height > 20;
        });

        var height = fixedHeader
          ? Math.max(44, Math.round(fixedHeader.getBoundingClientRect().height))
          : 56;

        root.style.setProperty("--px-header", height + "px");
      }

      function init() {
        syncHeaderOffset();
        window.setTimeout(syncHeaderOffset, 0);
        window.setTimeout(syncHeaderOffset, 250);
        window.setTimeout(syncHeaderOffset, 1200);
        window.addEventListener("load", syncHeaderOffset, { once: true });
        window.addEventListener("hashchange", function () {
          if (newsData) renderDossier(newsData);
        });

        loadNews().catch(function () {
          showLoadError();
        });
      }

      init();
    })();
  </script>
</body>
