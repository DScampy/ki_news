<!-- ── Theme-Hook: Archiv-spezifische Inline-Styles bei Theme-Wechsel ──
     (Theme-Logik selbst kommt zentral aus assets/ki-layout.js) -->
<script>
window.__kiThemeHook = function(isLight){
  ['viewToggle','mobileSearch','filterChipLabel'].forEach(function(id){
    var el = document.getElementById(id);
    if(el){ el.style.background = isLight ? '#f8fafc' : '#16181c'; el.style.borderColor = isLight ? '#e2e8f0' : '#2f3336'; }
  });
  if (typeof setLayout === 'function') setLayout(window._currentLayout || 'grid');
};
document.addEventListener('DOMContentLoaded', function(){ if (window.__kiApplyTheme) window.__kiApplyTheme(); });
</script>

      <div id="video-panel-body" style="display:none;padding:0 20px 20px">
        <div id="video-archive-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;"></div>
      </div>
    </div>

    <!-- 𝕏 X-Beiträge Archiv (dynamisch aus media.json) ───────────────────── -->
    <div id="xpost-panel" class="mb-6 border border-[#2f3336] bg-[#0d1117]" style="border-radius:6px;overflow:hidden">
      <button onclick="toggleXPostPanel()" class="w-full flex items-center justify-between px-5 py-3 panel-toggle-btn transition-all">
        <div class="flex items-center gap-2">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" class="text-[#1d9bf0]" style="flex-shrink:0"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.253 5.62 4.911-5.62zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"></path></svg>
          <span class="text-[11px] font-mono text-[#1d9bf0] font-bold uppercase tracking-widest">𝕏 X-Beiträge</span>
          <span class="text-[9px] font-mono text-gray-500 border border-[#2f3336] px-1.5 py-0.5" id="xpost-count"></span>
        </div>
        <span class="material-symbols-outlined text-gray-600 text-sm" id="xpost-panel-icon">expand_more</span>
      </button>
      <div id="xpost-panel-body" style="display:none;padding:0 20px 20px">
        <div id="xpost-archive-list" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;align-items:start;"></div>
      </div>
    </div>

    <!-- Hashtag Panel ─────────────────────────────────────────────────── -->
    <div id="hashtags" class="mb-6 border border-[#2f3336] bg-[#0d1117]" style="border-radius:6px;overflow:hidden">
      <button onclick="toggleHashtagPanel()" class="w-full flex items-center justify-between px-5 py-3 panel-toggle-btn transition-all">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-[#1d9bf0] text-base">tag</span>
          <span class="text-[11px] font-mono text-[#1d9bf0] font-bold uppercase tracking-widest"># Hashtags</span>
          <span class="text-[9px] font-mono text-gray-500 border border-[#2f3336] px-1.5 py-0.5" id="hashtag-count"></span>
        </div>
        <span class="material-symbols-outlined text-gray-600 text-sm" id="hashtag-panel-icon">expand_more</span>
      </button>
      <div id="hashtag-panel-body" style="display:none;padding:0 20px 16px">
        <div id="hashtag-chips-archiv" class="flex flex-wrap gap-1.5"></div>
      </div>
    </div>

    <!-- Loading skeleton -->
    <div id="skeleton" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-gutter">
      <div class="bg-[#16181c] border border-[#2f3336] p-4 h-48 animate-pulse"></div>
      <div class="bg-[#16181c] border border-[#2f3336] p-4 h-48 animate-pulse"></div>
      <div class="bg-[#16181c] border border-[#2f3336] p-4 h-48 animate-pulse"></div>
      <div class="bg-[#16181c] border border-[#2f3336] p-4 h-48 animate-pulse"></div>
    </div>

    <!-- News grid -->
    <div id="newsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-gutter hidden"></div>

    <!-- Empty state -->
    <div id="emptyState" class="hidden py-24 text-center">
      <span class="material-symbols-outlined text-gray-700 text-5xl mb-4 block">search_off</span>
      <p class="text-gray-500 font-mono text-sm">Keine Artikel gefunden.</p>
      <button onclick="clearSearch(); clearFilter()" class="mt-4 text-[#1d9bf0] text-xs font-mono hover:underline">Filter zurücksetzen</button>
    </div>

    <!-- Footer -->
    <div class="mt-12 pb-12 border-t border-[#2f3336] pt-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div>
        <span class="text-white font-black text-lg tracking-tighter" style="font-family:'Space Grotesk',sans-serif">KI NEWS</span>
        <p class="text-[11px] text-gray-500 font-mono mt-1">Täglich. Auf Deutsch. Mit Kontext. – von <a href="https://x.com/CScampy" target="_blank" class="text-[#1d9bf0] hover:underline">@CScampy</a></p>
      </div>
      <div class="flex items-center gap-4">
        <a href="/" class="text-gray-500 hover:text-white transition-colors text-xs font-mono">Aktuell</a>
        <a href="https://x.com/CScampy" target="_blank" class="text-gray-500 hover:text-white transition-colors text-xs font-mono">X/Twitter</a>
        <a href="https://soundcloud.com/dscampy/sets/podcast-wissen" target="_blank" class="text-gray-500 hover:text-white transition-colors text-xs font-mono">Podcast</a>
      </div>
    </div>
  </div>
<footer style="position:relative;z-index:20;border-top:1px solid rgba(127,127,127,0.18);padding:22px 24px;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:0.02em;color:#64748b;">
  <a href="Impressum.html" style="color:inherit;text-decoration:none;margin:0 10px;">Impressum</a>·
  <a href="Datenschutz.html" style="color:inherit;text-decoration:none;margin:0 10px;">Datenschutz</a>
</footer>
</main>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let allNews = [];
let activeSource = null;
let searchQuery = '';
let layout = 'grid';
let sourcesExpanded = true;

function toggleSources() {
  sourcesExpanded = !sourcesExpanded;
  const el = document.getElementById('sourceFilters');
  const icon = document.getElementById('sourcesToggleIcon');
  if (el) el.style.display = sourcesExpanded ? '' : 'none';
  if (icon) icon.textContent = sourcesExpanded ? 'expand_less' : 'expand_more';
}

// Re-render wenn Theme wechselt (damit Kartenfarben korrekt sind)
const _themeObserver = new MutationObserver(() => {
  if (allNews.length > 0) render();
});
_themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

// ── Source config ────────────────────────────────────────────────────────────
const SOURCE_CONFIG = {
  'The Decoder':    { color: '#1d9bf0', textClass: 'text-[#1d9bf0]' },
  'TechCrunch AI':  { color: '#ff6b35', textClass: 'text-[#ff6b35]' },
  'VentureBeat AI': { color: '#7c3aed', textClass: 'text-[#a78bfa]' },
  'MIT Tech Review':{ color: '#dc2626', textClass: 'text-[#f87171]' },
  'Ars Technica':   { color: '#16a34a', textClass: 'text-[#4ade80]' },
  'Heise':          { color: '#2563eb', textClass: 'text-[#60a5fa]' },
};
function srcConf(source) {
  return SOURCE_CONFIG[source] || { color: '#1d9bf0', textClass: 'text-[#1d9bf0]' };
}

// ── localStorage Persistenz ───────────────────────────────────────────────────
const ARCHIVE_KEY = 'ki_news_archive';
const ARCHIVE_VERSION = 'v3'; // erhöhen wenn localStorage geflusht werden soll

function loadArchive() {
  try {
    // Cache-Version prüfen – bei Mismatch alten Cache löschen (behebt Encoding-Fehler)
    if (localStorage.getItem('ki_archive_ver') !== ARCHIVE_VERSION) {
      localStorage.removeItem(ARCHIVE_KEY);
      localStorage.setItem('ki_archive_ver', ARCHIVE_VERSION);
      return [];
    }
    const raw = localStorage.getItem(ARCHIVE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

function saveArchive(newsArray) {
  try {
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify(newsArray));
  } catch(e) {
    // localStorage voll – älteste 20 entfernen und nochmal versuchen
    try {
      const trimmed = newsArray.slice(-200);
      localStorage.setItem(ARCHIVE_KEY, JSON.stringify(trimmed));
    } catch(e2) {}
  }
}

function mergeNews(existing, incoming) {
  // Deduplizierung per Link
  const seen = new Set(existing.map(n => n.link));
  const newOnes = incoming.filter(n => n.link && !seen.has(n.link));
  // Neue vorne, alte hinten – max 500 Einträge gesamt
  return [...incoming, ...existing.filter(n => !incoming.find(i => i.link === n.link))].slice(0, 500);
}

// ── Load ─────────────────────────────────────────────────────────────────────
// 1. Sofort aus localStorage laden (blitzschnell)
const archived = loadArchive();
if (archived.length > 0) {
  allNews = archived;
  buildSourceFilters();
  render();
  document.getElementById('skeleton').classList.add('hidden');
  document.getElementById('newsGrid').classList.remove('hidden');
}

// 2. Dann aktuell von news.json nachladen und mergen
fetch('news.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    const fresh = data.news || [];
    if (data.stand) {
      document.getElementById('standLabel').textContent = data.stand;
    }
    allNews = mergeNews(archived, fresh);
    saveArchive(allNews);
    buildSourceFilters();
    render();
    document.getElementById('skeleton').classList.add('hidden');
    document.getElementById('newsGrid').classList.remove('hidden');

    // Versuche auch archive.json zu laden (kumulatives Server-Archiv)
    fetch('archive.json?t=' + Date.now())
      .then(r => r.json())
      .then(serverArchive => {
        if (serverArchive && serverArchive.length > allNews.length) {
          allNews = mergeNews(allNews, serverArchive);
          saveArchive(allNews);
          buildSourceFilters();
          render();
        }
      })
      .catch(() => {}); // archive.json optional

    // Info-Badge: wie viele Artikel insgesamt im Archiv
    const archiveBadge = document.getElementById('archiveBadge');
    if (archiveBadge) {
      archiveBadge.textContent = allNews.length + ' Artikel gespeichert';
      archiveBadge.style.display = '';
    }
  })
  .catch(() => {
    if (archived.length === 0) {
      document.getElementById('skeleton').classList.add('hidden');
      document.getElementById('countLabel').textContent = 'Fehler beim Laden.';
      document.getElementById('emptyState').classList.remove('hidden');
    }
    // Falls offline aber Archive vorhanden – weiter mit alten Daten
  });

// ── Source filters ────────────────────────────────────────────────────────────
function buildSourceFilters() {
  const isLight = document.documentElement.classList.contains('light');
  const sources = [...new Set(allNews.map(n => n.source).filter(Boolean))];
  const container = document.getElementById('sourceFilters');
  container.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.id = 'src-all';
  allBtn.className = 'flex items-center justify-between px-3 py-2 text-xs font-mono uppercase tracking-wider transition-all border-l-2';
  allBtn.style.background = 'rgba(var(--neon-rgb),0.10)';
  allBtn.style.color = 'var(--accent)';
  allBtn.style.borderLeftColor = 'var(--accent)';
  allBtn.innerHTML = `<span>Alle</span><span style="color:var(--muted,#6b7280)">${allNews.length}</span>`;
  allBtn.onclick = () => { clearFilter(); };
  container.appendChild(allBtn);

  sources.forEach(src => {
    const conf = srcConf(src);
    const count = allNews.filter(n => n.source === src).length;
    const btn = document.createElement('button');
    btn.id = 'src-' + src.replace(/\s/g, '-');
    btn.className = 'flex items-center justify-between px-3 py-2 text-xs font-mono uppercase tracking-wider transition-all border-l-2';
    btn.style.background = 'transparent';
    btn.style.color = 'var(--muted,#9ca3af)';
    btn.style.borderLeftColor = 'transparent';
    btn.innerHTML = `<span>${escapeHtml(src)}</span><span style="color:var(--muted,#6b7280)">${count}</span>`;
    btn.onmouseenter = () => { btn.style.background = 'rgba(var(--neon-rgb),0.06)'; btn.style.color = 'var(--text,#fff)'; };
    btn.onmouseleave = () => { if (activeSource !== src) { btn.style.background = 'transparent'; btn.style.color = 'var(--muted,#9ca3af)'; } };
    btn.onclick = () => setFilter(src);
    container.appendChild(btn);
  });
}

function updateSourceFilterUI() {
  const activeBg = 'rgba(var(--neon-rgb),0.10)';
  const sources = [...new Set(allNews.map(n => n.source).filter(Boolean))];
  const allBtn = document.getElementById('src-all');
  if (allBtn) {
    allBtn.className = 'flex items-center justify-between px-3 py-2 text-xs font-mono uppercase tracking-wider transition-all border-l-2';
    allBtn.style.background = !activeSource ? activeBg : 'transparent';
    allBtn.style.color = !activeSource ? 'var(--accent)' : 'var(--muted,#9ca3af)';
    allBtn.style.borderLeftColor = !activeSource ? 'var(--accent)' : 'transparent';
  }
  sources.forEach(src => {
    const btn = document.getElementById('src-' + src.replace(/\s/g, '-'));
    if (btn) {
      const conf = srcConf(src);
      btn.className = 'flex items-center justify-between px-3 py-2 text-xs font-mono uppercase tracking-wider transition-all border-l-2';
      if (activeSource === src) {
        btn.style.background = activeBg;
        btn.style.borderLeftColor = conf.color;
        btn.style.color = conf.color;
      } else {
        btn.style.background = 'transparent';
        btn.style.borderLeftColor = 'transparent';
        btn.style.color = 'var(--muted,#9ca3af)';
      }
    }
  });
}

// ── Filters & search ─────────────────────────────────────────────────────────
function setFilter(src) {
  activeSource = src;
  const chip = document.getElementById('filterChip');
  document.getElementById('filterChipText').textContent = src;
  chip.classList.remove('hidden');
  chip.classList.add('flex');
  updateSourceFilterUI();
  render();
}

function clearFilter() {
  activeSource = null;
  const chip = document.getElementById('filterChip');
  chip.classList.add('hidden');
  chip.classList.remove('flex');
  updateSourceFilterUI();
  render();
}

function handleSearch(q) {
  searchQuery = q.trim();
  const wrap = document.getElementById('searchWrap');
  if (searchQuery) wrap.classList.add('has-search');
  else wrap.classList.remove('has-search');
  render();
}

function clearSearch() {
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchWrap').classList.remove('has-search');
  render();
}

function setLayout(l) {
  layout = l;
  window._currentLayout = l;
  const isLight = document.documentElement.classList.contains('light');
  const activeBg = isLight ? '#e2e8f0' : '#1d1f23';
  const activeColor = '#1d9bf0';
  const grid = document.getElementById('newsGrid');
  const btnGrid = document.getElementById('btnGrid');
  const btnList = document.getElementById('btnList');
  const baseClass = 'flex items-center gap-1.5 px-3 py-1.5 text-xs font-mono uppercase tracking-wider transition-all';
  if (l === 'grid') {
    grid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-gutter';
    btnGrid.className = baseClass; btnGrid.style.background = activeBg; btnGrid.style.color = activeColor; btnGrid.style.border = 'none';
    btnList.className = baseClass; btnList.style.background = 'transparent'; btnList.style.color = isLight ? '#64748b' : '#6b7280'; btnList.style.border = 'none';
  } else {
    grid.className = 'grid grid-cols-1 gap-3';
    btnList.className = baseClass; btnList.style.background = activeBg; btnList.style.color = activeColor; btnList.style.border = 'none';
    btnGrid.className = baseClass; btnGrid.style.background = 'transparent'; btnGrid.style.color = isLight ? '#64748b' : '#6b7280'; btnGrid.style.border = 'none';
  }
  render();
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const q = searchQuery.toLowerCase();
  const filtered = allNews.filter(n => {
    if (activeSource && n.source !== activeSource) return false;
    if (q && !(n.title||'').toLowerCase().includes(q) && !(n.summary||'').toLowerCase().includes(q)) return false;
    return true;
  });

  const grid = document.getElementById('newsGrid');
  const empty = document.getElementById('emptyState');
  const countLabel = document.getElementById('countLabel');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
    countLabel.textContent = 'Keine Artikel';
    return;
  }
  empty.classList.add('hidden');
  countLabel.textContent = `${filtered.length} Artikel${activeSource ? ' · ' + activeSource : ''}${searchQuery ? ' · "' + searchQuery + '"' : ''}`;
  grid.innerHTML = '';

  /* ── Pagination: ohne Filter/Suche zuerst nur die letzten 14 Tage,
        ältere Beiträge chunk-weise auf Klick (DOM bleibt klein) ── */
  const PAGE_CHUNK = 100;
  const isFiltering = !!(activeSource || q);
  let visible = filtered, rest = [];
  if (!isFiltering) {
    const cutoff = Date.now() - 14 * 86400000;
    const isRecent = n => {
      const raw = n.first_seen || n.date || '';
      const t = raw ? new Date(String(raw).length <= 10 ? raw + 'T00:00:00' : raw).getTime() : 0;
      return t >= cutoff;
    };
    visible = filtered.filter(isRecent);
    rest = filtered.filter(n => !isRecent(n));
    /* Falls (fast) nichts in 14 Tagen: mindestens 40 zeigen */
    if (visible.length < 40) { visible = filtered.slice(0, 40); rest = filtered.slice(40); }
  }
  visible.forEach(item => grid.appendChild(createCard(item)));
  window._archRest = rest;
  if (rest.length) {
    const moreWrap = document.createElement('div');
    moreWrap.id = 'archMoreWrap';
    moreWrap.style.cssText = 'grid-column:1/-1;display:flex;justify-content:center;padding:18px 0 6px;';
    moreWrap.innerHTML = '<button id="archMoreBtn" style="font-family:\'Space Grotesk\',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);background:rgba(var(--neon-rgb),0.08);border:1px solid rgba(var(--neon-rgb),0.35);border-radius:999px;padding:10px 22px;cursor:pointer;transition:all .15s;">&#9660; &Auml;ltere Beitr&auml;ge anzeigen (' + rest.length + ')</button>';
    grid.appendChild(moreWrap);
    document.getElementById('archMoreBtn').onclick = function(){
      const chunk = window._archRest.splice(0, PAGE_CHUNK);
      const wrap = document.getElementById('archMoreWrap');
      chunk.forEach(item => grid.insertBefore(createCard(item), wrap));
      if (window._archRest.length) {
        document.getElementById('archMoreBtn').innerHTML = '&#9660; &Auml;ltere Beitr&auml;ge anzeigen (' + window._archRest.length + ')';
      } else {
        wrap.remove();
      }
    };
  }
}

function relDate(d) {
  if (!d) return '';
  const then = new Date(String(d).length <= 10 ? d + 'T00:00:00' : d);
  if (isNaN(then)) return '';
  const now = new Date();
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const d0 = new Date(then.getFullYear(), then.getMonth(), then.getDate());
  const days = Math.round((t0 - d0) / 86400000);
  if (days <= 0) return 'Heute';
  if (days === 1) return 'Gestern';
  if (days < 7) return 'vor ' + days + ' Tagen';
  return then.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

// XSS-Schutz: Fremddaten (Feed-Titel, LLM-Text) vor innerHTML escapen.
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, ch =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
}

function createCard(item) {
  const conf = srcConf(item.source);
  const isList = layout === 'list';
  const isLight = document.documentElement.classList.contains('light');
  const a = document.createElement('a');
  a.href = item.link || '#';
  if (item.link) a.target = '_blank';
  a.style.setProperty('--accent-color', conf.color);
  // Use semantic classes that respond to light/dark CSS
  a.className = `card-hover transition-all group cursor-pointer flex ${isList ? 'flex-row items-start gap-4 p-4' : 'flex-col p-4 h-full'}`;
  a.style.background = isLight ? '#ffffff' : '#16181c';
  a.style.border = isLight ? '1px solid rgba(var(--neon-rgb),0.20)' : '1px solid rgba(var(--neon-rgb),0.35)';
  a.style.borderRadius = '10px';
  a.style.boxShadow = isLight ? '0 0 0 1px rgba(var(--neon-rgb),0.05),0 0 10px rgba(var(--neon-rgb),0.08)' : '0 0 0 1px rgba(var(--neon-rgb),0.08),0 0 14px rgba(var(--neon-rgb),0.14)';
  a.onmouseenter = () => {
    a.style.border = `1px solid rgba(var(--neon-rgb),${isLight ? '0.55' : '0.65'})`;
    a.style.boxShadow = isLight ? '0 0 0 1px rgba(var(--neon-rgb),0.15),0 0 20px rgba(var(--neon-rgb),0.20)' : '0 0 0 1px rgba(var(--neon-rgb),0.20),0 0 24px rgba(var(--neon-rgb),0.28)';
    a.style.background = isLight ? '#f8fafc' : '#1a2235';
  };
  a.onmouseleave = () => {
    a.style.border = isLight ? '1px solid rgba(var(--neon-rgb),0.20)' : '1px solid rgba(var(--neon-rgb),0.35)';
    a.style.boxShadow = isLight ? '0 0 0 1px rgba(var(--neon-rgb),0.05),0 0 10px rgba(var(--neon-rgb),0.08)' : '0 0 0 1px rgba(var(--neon-rgb),0.08),0 0 14px rgba(var(--neon-rgb),0.14)';
    a.style.background = isLight ? '#ffffff' : '#16181c';
  };

  const titleColor = isLight ? '#0f172a' : '#dfe3ea';
  const mutedColor = isLight ? '#64748b' : '#bfc7d3';
  const borderColor = isLight ? '#e2e8f0' : '#2f3336';
  const iconColor = isLight ? '#94a3b8' : '#4b5563';

  if (isList) {
    a.innerHTML = `
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 mb-2 flex-wrap">
          <span style="background:${conf.color}" class="text-white px-2 py-0.5 text-[10px] font-mono rounded-sm uppercase flex-shrink-0">${escapeHtml(item.source || '—')}</span> ${item.date ? `<span style="font-size:10px;font-family:monospace;margin-left:2px;color:${mutedColor}">${relDate(item.date)}</span>` : ''}
        </div>
        <h4 class="font-headline-md leading-snug transition-colors mb-1 text-base" style="font-family:'Space Grotesk',sans-serif;color:${titleColor}">${escapeHtml(item.title || '')}</h4>
        <p class="font-body-sm text-body-sm line-clamp-2" style="color:${mutedColor}">${escapeHtml(item.summary || '')}</p>
      </div>
      <span class="material-symbols-outlined text-sm flex-shrink-0 mt-1" style="color:${iconColor}">open_in_new</span>`;
  } else {
    a.innerHTML = `
      <div class="flex items-center justify-between mb-4">
        <span style="background:${conf.color}" class="text-white px-2 py-0.5 font-source-tag text-source-tag rounded-sm uppercase">${escapeHtml(item.source || '—')}</span> ${item.date ? `<span style="font-size:10px;font-family:monospace;margin-left:2px;color:${mutedColor}">${relDate(item.date)}</span>` : ''}
        <span class="material-symbols-outlined text-sm" style="color:${iconColor}">open_in_new</span>
      </div>
      <h4 class="font-headline-md mb-2 leading-snug transition-colors flex-grow" style="font-family:'Space Grotesk',sans-serif;color:${titleColor}">${escapeHtml(item.title || '')}</h4>

}

let hashtagPanelOpen = false;
function toggleHashtagPanel() {
  hashtagPanelOpen = !hashtagPanelOpen;
  const body = document.getElementById('hashtag-panel-body');
  const icon = document.getElementById('hashtag-panel-icon');
  if (body) body.style.display = hashtagPanelOpen ? '' : 'none';
  if (icon) icon.textContent = hashtagPanelOpen ? 'expand_less' : 'expand_more';

function renderHashtagChips(tags) {
  const container = document.getElementById('hashtag-chips-archiv');
  const countEl = document.getElementById('hashtag-count');
  if (!container) return;
  container.innerHTML = '';
  // Alphabetisch sortieren (Groß-/Kleinschreibung ignorieren, # wird übersehen)
  const sorted = [...tags].sort((a, b) => a.replace(/^#/,'').toLowerCase().localeCompare(b.replace(/^#/,'').toLowerCase()));
  if (countEl) countEl.textContent = sorted.length + ' Tags';
  sorted.forEach(tag => {
    const chip = document.createElement('span');
    chip.style.cssText = 'display:inline-flex;align-items:center;background:rgba(var(--neon-rgb),0.10);border:1px solid rgba(var(--neon-rgb),0.30);color:var(--accent);font-size:11px;font-weight:700;padding:2px 10px;border-radius:4px;font-family:monospace;cursor:pointer;transition:all 0.15s';
    chip.textContent = tag;
    chip.title = 'Klick: Artikel filtern | Doppelklick: Kopieren';
    // Einfachklick → Artikel nach Hashtag-Keyword filtern
    chip.onclick = () => {
      const kw = tag.replace(/^#/, ''); // "#OpenAI" → "OpenAI"
      searchQuery = kw;
      const input = document.getElementById('searchInput');
      if (input) { input.value = kw; input.dispatchEvent(new Event('input')); }
      document.getElementById('searchWrap')?.classList.add('has-search');
      render();
      // Panel schließen & zu Ergebnissen scrollen
      if (hashtagPanelOpen) toggleHashtagPanel();
      document.getElementById('newsGrid')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      // Kurzes visuelles Feedback
      chip.style.background = 'rgba(var(--neon-rgb),0.25)';
      chip.style.borderColor = 'var(--accent)';
      setTimeout(() => {
        chip.style.background = 'rgba(var(--neon-rgb),0.10)';
        chip.style.borderColor = 'rgba(var(--neon-rgb),0.30)';
      }, 600);
    };
    // Doppelklick → Kopieren
    chip.ondblclick = (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(tag).catch(()=>{});
      chip.style.background = '#16a34a';
      chip.style.color = '#fff';
      chip.style.borderColor = '#16a34a';
      setTimeout(() => {
        chip.style.background = 'rgba(var(--neon-rgb),0.10)';
        chip.style.color = 'var(--accent)';
        chip.style.borderColor = 'rgba(var(--neon-rgb),0.30)';
      }, 1200);
    };
    container.appendChild(chip);
  });
}

function xpostTweetId(u){ const m=(u||'').match(/status(?:es)?\/(\d+)/); return m?m[1]:''; }
function buildXPostCard(x){
  const url = typeof x==='string' ? x : (x && x.url);
  if (!url || !xpostTweetId(url)) return '';
  const href = url.replace(/^https?:\/\/(www\.)?x\.com/, 'https://twitter.com');
  const img = (typeof x==='object' && x && x.image) ? x.image : '';
  const prev = img ? (' data-ki-preview="' + String(img).replace(/"/g,'&quot;') + '"') : '';
  return '<blockquote class="twitter-tweet" data-lang="de" data-dnt="true" data-theme="dark"' + prev + ' style="margin:0;max-width:520px;width:100%"><a href="' + href + '"></a></blockquote>';
}

function buildVideoCard(v) {
  if (!v || v.type === 'none' || !v.src) return '';
  let player = '';
  if (v.type === 'local') {
    player = `<div style="background:#000;border-radius:4px;overflow:hidden;margin-bottom:8px">
      <div style="font-size:9px;font-weight:700;letter-spacing:0.08em;padding:3px 8px;background:#1d9bf0;color:white;text-transform:uppercase">${v.label||'VIDEO'}</div>
      <video controls preload="metadata" style="width:100%;max-height:180px;display:block;object-fit:contain;background:#000"><source src="${v.src}" type="video/mp4"/></video>
    </div>`;
  } else if (v.type === 'youtube') {
    const ytId = v.src.match(/(?:v=|youtu\.be\/)([^&?/]+)/)?.[1] || v.src;
    player = `<div style="border-radius:4px;overflow:hidden;margin-bottom:8px">
      <div style="font-size:9px;font-weight:700;letter-spacing:0.08em;padding:3px 8px;background:#dc2626;color:white;text-transform:uppercase">${v.label||'VIDEO'}</div>
      ${KIEmbed.youtube(ytId,{label:''})}
    </div>`;
  } else if (v.type === 'vimeo') {
    const vmId = v.src.match(/vimeo\.com\/(\d+)/)?.[1] || v.src;
    player = `<div style="border-radius:4px;overflow:hidden;margin-bottom:8px">
      <div style="font-size:9px;font-weight:700;letter-spacing:0.08em;padding:3px 8px;background:#1ab7ea;color:white;text-transform:uppercase">${v.label||'VIDEO'}</div>
      ${KIEmbed.vimeo(vmId,{label:''})}
    </div>`;
  }
  return `<div style="border:1px solid #2f3336;border-radius:4px;background:#16181c;padding:16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <span style="font-size:9px;font-family:monospace;font-weight:700;color:#dc2626;text-transform:uppercase;letter-spacing:0.1em">VIDEO #${v.id||''}</span>
      <span style="font-size:9px;font-family:monospace;color:#536471">${v.date||''}</span>
    </div>
    <h4 style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:#dfe3ea;margin-bottom:10px">${v.title||''}</h4>
    ${player}
  </div>`;
}

fetch('media.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    const podcasts = data.podcasts || [];
    const videos = data.videos || [];

    // ── Podcasts ──

            : '';
          return `<div style="border:1px solid #2f3336;border-radius:4px;background:#16181c;padding:16px;margin-bottom:12px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
              <span style="font-size:9px;font-family:monospace;font-weight:700;color:#1d9bf0;text-transform:uppercase;letter-spacing:0.1em">KI NEWS #${ep.id}</span>
              ${ep.duration ? `<span style="font-size:9px;font-family:monospace;color:#536471">${ep.duration}</span>` : `<span style="font-size:9px;font-family:monospace;color:#536471">${ep.date||''}</span>`}
            </div>
            <h4 style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:#dfe3ea;margin-bottom:4px">${ep.title}</h4>
            <p style="font-size:12px;color:#536471;margin-bottom:10px">${ep.description||''}</p>
            ${scUrl
              ? KIEmbed.soundcloud(scUrl,{height:80})
              : '<p style="font-size:11px;color:#536471;font-family:monospace;margin-bottom:6px">Player wird bald verfügbar…</p>'}
            <div style="margin-top:8px">
              <a href="${ep.soundcloud_url}" target="_blank"
                style="display:inline-flex;align-items:center;gap:6px;color:#1d9bf0;font-size:11px;font-family:monospace;text-decoration:none">
                <span class="material-symbols-outlined" style="font-size:14px">open_in_new</span>Auf SoundCloud anhören
              </a>
            </div>
          </div>`;
        }).join('');
      }
    }

    // ── Videos ──
    const vcountEl = document.getElementById('video-count');
    const vlistEl = document.getElementById('video-archive-list');
    if (vcountEl) vcountEl.textContent = videos.length + ' Videos';
    if (vlistEl) {
      if (!videos.length) {
        vlistEl.innerHTML = '<p style="font-size:11px;color:#536471;font-family:monospace">Noch keine Videos.</p>';
      } else {
        vlistEl.innerHTML = videos.map(v => buildVideoCard(v)).join('');
      }
    }

    // ── X-Beiträge ──
    const xposts = data.xposts || [];
    const xcountEl = document.getElementById('xpost-count');
    const xlistEl = document.getElementById('xpost-archive-list');
    if (xcountEl) xcountEl.textContent = xposts.length + (xposts.length === 1 ? ' Beitrag' : ' Beiträge');
    if (xlistEl) {
      const cards = xposts.map(x => buildXPostCard(x)).filter(Boolean).join('');
      xlistEl.innerHTML = cards || '<p style="font-size:11px;color:#536471;font-family:monospace">Noch keine X-Beiträge.</p>';
      if (window.KIEmbed && KIEmbed.wrapTweets) KIEmbed.wrapTweets(xlistEl);
    }
  })
  .catch(() => {
    const plistEl = document.getElementById('podcast-archive-list');
    if (plistEl) plistEl.innerHTML = '<p style="font-size:11px;color:#536471;font-family:monospace">Archiv konnte nicht geladen werden.</p>';
  });

<!-- ── KI Theme-Kopplung + Seiten-Hook (Toolbar/Karten) ── -->
<script>
window.__kiThemeHook=function(light,active){
  // Karten & Panels recolorieren bereits per html.light-CSS. Nur die inline-gestylte
  // Toolbar (viewToggle hat inline background) braucht eine Hand-Korrektur.
  var vt=document.getElementById('viewToggle');
  if(vt){vt.style.background=light?'#f1f5f9':'#16181c';vt.style.borderColor=light?'#e2e8f0':'#2f3336';}
};
(function(){
  var GEN=['genesis','karst','aurora','meridian','blanc'];
  function prefersLight(){return !!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches);}
  var memGen=null, memContrast=null;
  function getContrast(){var v=null;try{v=localStorage.getItem('ki_theme');}catch(e){}return v||memContrast||'auto';}
  function rawGenesis(){var v=null;try{v=localStorage.getItem('ki_genesis_theme');}catch(e){}return v||memGen||'genesis';}
  function getGenesis(){var g=rawGenesis();return GEN.indexOf(g)===-1?'genesis':g;}
  function resolveLight(){
    if(getGenesis()==='blanc')return true;
    var c=getContrast();
    return c==='light'?true:(c==='dark'?false:prefersLight());
  }
  function applyAll(){
    var root=document.documentElement, raw=rawGenesis();
    if(raw==='custom'){
      root.setAttribute('data-theme','custom');
      root.classList.remove('light','dark');
    }else{
      var g=getGenesis(), light=resolveLight();
      root.setAttribute('data-theme',g);
      root.classList.toggle('light',light);
      root.classList.toggle('dark',!light);
    }
    var active=(raw
