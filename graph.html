<script>
(function () {
  "use strict";
  var root = document.documentElement, canvas = document.getElementById("ga-canvas"), ctx = canvas.getContext("2d");
  var still = window.matchMedia("(prefers-reduced-motion: reduce)");
  var C = {};
  function farben() { var s = getComputedStyle(root); ["anbieter", "modell", "thema", "produkt", "sonst", "--ga-ink", "--ga-muted", "--ga-bg"].forEach(function (k) { C[k.replace(/^--/, "")] = s.getPropertyValue(k.indexOf("--") === 0 ? k : "--" + k).trim(); }); }
  farben();
  new MutationObserver(function () { farben(); zeichne(); }).observe(root, { attributes: true, attributeFilter: ["class"] });
  function farbe(t) { return C[t] || C.sonst; }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  // ── Daten (Logik der bisherigen graph.html) ──
  var HEUTE = new Date();
  function tage(d) { if (!d) return 9999; var t = (HEUTE - new Date(d + "T12:00:00")) / 86400000; return t < 0 ? 0 : Math.round(t); }
  var QUELLEN = {
    live: { datei: "graph.json", text: "Wie die Pipeline zählt: pro Story seit 11.08., alte Links fallen nach 30 Tagen aus dem Abgleich. Beginnt am 16.07.2026." },
    hist: { datei: "graph_historie.json", text: "Einmalig zurückgerechnet aus der Repo-Historie ab 01.05.2026, gezählt pro Artikel. Zeigt mehr, aber nicht dieselbe Zählweise, im Überschneidungszeitraum rund 13 % höher." }
  };
  var quelle = "live", N = [], E = [], byId = {}, ARTIKEL = [];
  function indexiereArtikel(ent, news) {
    var muster = [];
    (ent.entities || []).forEach(function (e) { try { muster.push({ id: e.id, re: new RegExp((e.aliasse || []).join("|"), "i") }); } catch (err) {} });
    ARTIKEL = (news || []).map(function (n) {
      var text = (n.title || "") + " " + (n.summary || ""), ids = {};
      muster.forEach(function (m) { if (m.re.test(text)) ids[m.id] = 1; });
      return { titel: n.title || "", link: n.link || "", datum: n.first_seen || n.date || "", ids: ids };
    });
  }
  function meldungenFuer(a, b) { return ARTIKEL.filter(function (x) { return x.ids[a] && x.ids[b]; }).sort(function (p, q) { return (q.datum || "").localeCompare(p.datum || ""); }); }

  function lade(q) {
    quelle = q; aktiv = null; zu();
    document.getElementById("ga-q-live").setAttribute("aria-pressed", q === "live" ? "true" : "false");
    document.getElementById("ga-q-hist").setAttribute("aria-pressed", q === "hist" ? "true" : "false");
    document.getElementById("ga-q-text").textContent = QUELLEN[q].text;
    document.getElementById("ga-fehler").style.display = "none";
    Promise.all([
      fetch(QUELLEN[q].datei).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
      fetch("entities.json").then(function (r) { return r.json(); }).catch(function () { return { entities: [] }; }),
      fetch("news.json").then(function (r) { return r.json(); }).catch(function () { return { news: [] }; })
    ]).then(aufbauen).catch(function (err) {
      var f = document.getElementById("ga-fehler");
      f.innerHTML = "Konnte <code>" + esc(QUELLEN[q].datei) + "</code> nicht laden.<br>Lokal braucht die Seite einen Server: <code>python -m http.server 8000</code><br><span style='opacity:.6'>" + esc(err.message) + "</span>";
      f.style.display = "grid"; document.getElementById("ga-stand").textContent = "keine Daten";
    });
  }
  document.getElementById("ga-q-live").onclick = function () { if (quelle !== "live") lade("live"); };
  document.getElementById("ga-q-hist").onclick = function () { if (quelle !== "hist") lade("hist"); };

  var typAn = {};
  function aufbauen(res) {
    var g = res[0], ent = res[1], eltern = {};
    indexiereArtikel(ent, (res[2] || {}).news);
    (ent.entities || []).forEach(function (e) { eltern[e.id] = e.gehoert_zu || null; });
    N = (g.nodes || []).map(function (n, i) {
      // Startpositionen auf einer Fibonacci-Kugel, groesste innen
      return { id: n.id, count: n.count || 0, typ: n.typ || "sonst", eltern: n.gehoert_zu || eltern[n.id] || null, first: n.first_seen, last: n.last_seen, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0 };
    });
    byId = {}; N.forEach(function (n) { byId[n.id] = n; });
    E = (g.edges || []).filter(function (e) { return byId[e.source] && byId[e.target]; }).map(function (e) {
      var a = byId[e.source], b = byId[e.target];
      return { a: a, b: b, count: e.count || 0, first: e.first_seen, last: e.last_seen, triv: a.eltern === b.id || b.eltern === a.id, phase: Math.random() };
    });
    var sort = N.slice().sort(function (a, b) { return b.count - a.count; }), gold = Math.PI * (3 - Math.sqrt(5));
    sort.forEach(function (n, i) { var y = 1 - (i / Math.max(1, sort.length - 1)) * 2, r = Math.sqrt(1 - y * y), th = gold * i, R = 90 + Math.sqrt(i) * 34;
      n.x = Math.cos(th) * r * R; n.y = y * R; n.z = Math.sin(th) * r * R; });
    var typen = {}; N.forEach(function (n) { typen[n.typ] = (typen[n.typ] || 0) + 1; });
    document.getElementById("ga-stand").innerHTML = "Stand <b>" + esc((g.stand || "?").slice(0, 16)) + "</b>";
    document.getElementById("ga-zaehlung").innerHTML = "<b>" + N.length + "</b> Entitäten · <b>" + E.length + "</b> Verbindungen";
    var box = document.getElementById("ga-typen"); box.querySelectorAll("label").forEach(function (l) { l.remove(); });
    var leg = document.getElementById("ga-legende"); leg.replaceChildren();
    Object.keys(typen).sort(function (a, b) { return typen[b] - typen[a]; }).forEach(function (t) {
      if (typAn[t] == null) typAn[t] = true;
      var l = document.createElement("label"); l.className = "ga-check";
      l.innerHTML = '<input type="checkbox"' + (typAn[t] ? " checked" : "") + '><span class="ga-punkt" style="background:' + farbe(t) + '"></span>' + esc(t) + '<span class="ga-anz">' + typen[t] + "</span>";
      l.querySelector("input").onchange = function (ev) { typAn[t] = ev.target.checked; filter(); };
      box.appendChild(l);
      var i = document.createElement("i"); i.innerHTML = '<b style="background:' + farbe(t) + ';color:' + farbe(t) + '"></b>' + esc(t); leg.appendChild(i);
    });
    var maxW = Math.max.apply(null, E.map(function (e) { return e.count; }).concat([1]));
    var w = document.getElementById("ga-wmin"); w.max = Math.min(maxW, 30); if (+w.value > +w.max) w.value = w.max;
    filter(); starte();
  }

  // ── Filter ──
  var Ef = [], Nf = [], tageMax = 9999, suche = "";
  function filter() {
